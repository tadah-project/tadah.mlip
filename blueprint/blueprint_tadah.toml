[TASKS.analysis.suggest_bounds]
description      = "Suggests OPTIM bounds for the configured descriptors from the data and the seed."
long_description = """
Reads the training configuration (DBFILE, TYPE2B, TYPEMB and the seed
values; a radial grid given by a generator, LIN or GEOM, is the grid it
makes), computes dataset statistics (per-pair r_ij percentiles and KDE
peaks, no densities) from the neighbour distances up to 1.25 times the
largest cutoff of the seed (RCUT2B, RCUTMB or the cutoff RADIUS of a
DESCRIPTOR block; a configuration without one is refused, and so is a
TYPE2B or TYPEMB line that names a descriptor without the RCUT2B or RCUTMB
line of its cutoff), then walks the metadata of each configured descriptor
and proposes one OPTIM bound per parameter entry. The shells, peaks and
percentiles a range is taken from are those of the element pairs the
descriptor's TYPE2B or TYPEMB line names, the neighbours it sums over: the
(Ta, W) distances for TYPE2B D2_Blip 4 4 Ta W. The parameters of a
DESCRIPTOR block get ranges around the seed's values, which the distances
do not set. Each descriptor of a D2_mJoin or DM_mJoin line, and each
descriptor that TYPEMB places among DESCRIPTOR blocks, gets the rows of its
own values and the element pairs of its own line, numbered as the whole key
numbers them. A key that the descriptors of a joined line share (RCUTENV)
gets one row. Each row gives its rationale: the form the range assumes and
the data it comes from (the cutoffs, and the centres and widths of the
densities), "fixed range" and why (the ranges of the densities ρ, which the
statistics do not hold), or the scale and the role of the parameter. The
range of a cutoff runs from 1.05 times the distance of the second neighbour
shell (or the median distance) to the 99th percentile of the distances, so
it can end past the seed's cutoff. For a line of several pairs it runs from
the largest low end of the pairs' ranges to the largest high end, so that
each cutoff in it holds neighbour distances of each pair, as AUDIT and
tadah analysis check_bounds judge each pair; any other range holds the
range of each pair. A rationale taken from the distances names the element
pair of each range it combines. Every range holds the seed's value, where a
search of tadah hpo starts. Where the data alone give a range that does not
hold the seed's value, the range is widened to hold it, and its rationale
says so. A row gets no OPTIM line, and its rationale says why, when the
data give it no range: data without a pair of atoms of the descriptor's
element pairs within the reach of the statistics (the rationale names the
pairs), a range of zero width (which tadah hpo refuses), the grids of
DM_REAM (which the neighbour distances do not set) and its knot degrees
(which tadah hpo does not search). The cutoff of D2_Knot5, or of a knot
DM_REAM density, is its largest knot, which tadah train and tadah hpo
derive (on a D2_mJoin or DM_mJoin line, the descriptor's own entry). Its
row has no OPTIM line, as tadah hpo warns that such a line has no effect.
The ranges of a Gaussian or a blip density depend on the seed's centre. A
centre at the origin (CGRIDMB 0) gets no OPTIM line, as its width sets its
reach. The width of a Gaussian there gets the widths over which the
Gaussian drops by a factor of 0.9 to 1/20 from the first neighbour shell to
the second, up to the width at which it is 1e-6 at the nearest neighbour.
The width of a blip there gets the widths whose reach, the distance at
which the blip falls to 1e-6, runs from the nearest neighbour to the
farthest within RCUTMB. Any other centre gets the range of itself +- the
FWHM of the neighbour shell nearest to it, kept within the neighbour
distances unless the centre lies outside them; its width gets 0.25/w^2 to
9/w^2 (Gaussian) or 1/w to 6/w (blip), with w that FWHM. A value of a
descriptor's TYPE2B line (the screening parameters of D2_ZBL, the exponents
of D2_MIE) gets a row without an OPTIM line, numbered as an OPTIM line
numbers the values of the key, by the numbers among them: tadah hpo does
not search it. Prints the table and writes the OPTIM lines, one line per
run of entries of a key with the same range, to the file --outfile names,
which -c needs: the configuration file refuses an OUTFILE line, which in a
training configuration names the potential file.
"""
examples         = ["tadah analysis suggest_bounds -c train.tadah --outfile suggested.hpo"]
[TASKS.analysis.suggest_bounds.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.verbose"]
[TASKS.analysis.suggest_bounds.keys.outfile]
value_N      = [1]
value_type   = ["STRING"]
value_format = ["<file>"]
[TASKS.analysis.suggest_bounds.groups.input]
description      = "Source: a training configuration file."
required_min = 1
required_max = 1
[TASKS.analysis.suggest_bounds.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config"]
[TASKS.analysis.suggest_bounds.groups.input.keys.config]
cli_needs = ["outfile"]

[TASKS.analysis.check_bounds]
description      = "Validates the search bounds of a target file: runs the pre-flight audit at every corner of the boxes tadah hpo searches. Returns a non-zero exit code if an OPTIM line is refused or any corner gives a FAIL finding."
long_description = """
Reads the target file of the run (--hpotarget, or an HPOTARGET line of
the seed configuration: the HPOTARGET line of a seed potential file (a file
with WEIGHTS, such as a best_pot.tadah) is not read, and a
WARNING names it with the other lines of the potential check_bounds does
not read; a run without a target file is refused, saying where it
goes) and reads its OPTIM lines as tadah hpo reads them against the
seed: every value an index list selects (`(1,3)`, `(1-3,5)`, `(1-7:2)`),
the boxes of an AUTO line as tadah hpo derives them, the values of a
DM_Embed component path, FIXWEIGHT coefficients through FIXINDEX,
continued lines, keys in any case. An OPTIM line tadah hpo refuses is
refused with tadah hpo's reason, naming the line and the file (`tadah
analysis check_bounds: line N of <file>: <reason>`, then the line). Only
the OPTIM lines are read, inside a block too: `tadah hpo --check` checks
the rest of the file. It samples
corners (full 2^k for k <= 12, otherwise a Latin-hypercube subsample of
`min(2^k, ceil(k log2(k)))`), and runs the pre-flight audit
at each corner in the context tadah hpo evaluates: the seed with the
corner's value of each OPTIM line in its own entry of the key (OPTIM KEY
(i) sets entry i; the other entries keep the seed's values; a radial grid
given by a generator is the grid it makes; a DM_Embed component path sets
the value of its component). D2_Knot5, or a knot DM_REAM
density, has its largest knot as its cutoff, as in tadah hpo. On a
D2_mJoin or DM_mJoin line that is the descriptor's own RCUT2B or RCUTMB
entry. A stated cutoff that differs is replaced, with a WARNING. The
statistics of the data are computed once, at the largest cutoff of the
seed and of the corners (the RADIUS of a DM_Embed component's density
included). Each corner is judged by the rules of AUDIT, with
that corner's cutoff. A corner that breaks a lower limit tadah hpo sets on
a box is a FAIL finding as well: for a
DM_REAM seed, which must declare RHOFORM, the limits of the density form
(under NONNEG and MONOTONE: AMPGRIDMB >= 0, WATOM > 0, and SGRIDMB > 0
under MONOTONE and for a Gaussian density under NONNEG), and in every form
a radial bump width > 0 (SGRIDMB of a Blip or Blip5 density, SGRID2B of a
D2_Blip or D2_Blip5 pair term, alone or on a D2_mJoin line, where the
entries of another descriptor keep its own rule).
Returns exit code 0 if all corners pass, and 1 if the run is refused (an
OPTIM line tadah hpo refuses among the reasons) or any corner produces a
FAIL finding.
"""
examples         = ["tadah analysis check_bounds -c train.tadah --hpotarget config.hpo"]
[TASKS.analysis.check_bounds.keys]
INHERIT          = ["ALLOWED_KEYS.verbose", "ALLOWED_KEYS.hpotarget"]
[TASKS.analysis.check_bounds.groups.input]
description      = "The training configuration (-c); the target file is given with --hpotarget or with an HPOTARGET line."
required_min = 1
required_max = 1
[TASKS.analysis.check_bounds.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config"]

[TASKS.analysis.bfunc]
description      = "Evaluates and plots basis functions."
long_description = "Long description: Evaluates and plots basis functions."
examples         = ["tadah analysis bfunc -p pot.tadah -o bfunc.txt -r 0 5 500 --type 2b Y"]
[TASKS.analysis.bfunc.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.range", "ALLOWED_KEYS.type", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.derivative", "ALLOWED_KEYS.index", "ALLOWED_KEYS.rescale"]
[TASKS.analysis.bfunc.keys.type]
value_N = [-2]
description  = "Basis function type. \"2b Y\" or \"mb N\"."
long_description  = """
Choice of basis function. For example: \"2b Y\" or \"mb N\".
Where Y/N controls computation of the cutoff function: with Y the
functions are followed by a block with the cutoff function (its
derivative with --derivative); --rescale multiplies the functions by it.
For a many-body descriptor with component channels (DM_Embed, DM_REAM),
\"mb DENSITY\" (the same as \"mb N\") prints the density functions in
the density's form and \"mb EMBEDDING\" the embedding functions, which
have no spatial cutoff (--rescale is refused for them); \"mb Y\" prints
the density functions and their cutoff.
"""
[TASKS.analysis.bfunc.keys.index]
description = "Basis-function indices."
long_description = """
The 1-based indices of the basis functions to evaluate, in the given order,
each between 1 and the number of functions of the descriptor (the number of
its CGRID2B or CGRIDMB values; of each descriptor of a D2_mJoin or DM_mJoin
line): single indices, ranges start-stop and intervals start-stop:step,
separated by commas or spaces (spaces around '-' and ':' are allowed; several
values form one list). Repeated indices are removed. A descending range, a
step of 0, a malformed or empty entry and an index outside the functions are
refused, naming it. Without --index every function is evaluated.
"""
[TASKS.analysis.bfunc.keys.rescale]
description = "Rescales the basis function by the cutoff function, for visualisation. It is refused for functions without a spatial cutoff, such as embedding functions."
[TASKS.analysis.bfunc.keys.outfile]
INHERIT = ["TYPES.STRING"]
[TASKS.analysis.bfunc.groups.input]
description      = "Either a potential file or a configuration file."
required_min = 1
required_max = 1
[TASKS.analysis.bfunc.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.potential", "ALLOWED_KEYS.config"]
[TASKS.analysis.bfunc.groups.input.keys.potential]
cli_excludes   = ["config"]
cli_needs = ["range", "type"]
[TASKS.analysis.bfunc.groups.input.keys.config]
cli_excludes   = ["potential"]
cli_needs = ["range", "type"]

[TASKS.analysis.cutoff]
description      = "Evaluates and plots cutoff functions."
long_description = "Long description: Evaluates and plots cutoff functions."
examples         = ["tadah analysis cutoff -o cutoff.txt -r 0 3.14 100 --type Cut_Cos --derivative"]
[TASKS.analysis.cutoff.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.range", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.derivative"]
[TASKS.analysis.cutoff.groups.input]
description      = "The cutoff type."
required_min = 1
required_max = 1
[TASKS.analysis.cutoff.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.type"]
[TASKS.analysis.cutoff.groups.input.keys.type]
cli_needs = ["range"]

