[ALLOWED_KEYS.refit_basis]
command_only = true
INHERIT = ["TYPES.STRING"]
description  = "Flexible-basis family used by `tadah refit`: Blip, Blip5, Knot3, Knot5, KnotMix or Gaussian; the default is Knot5 in compact mode and Blip in dense mode (an explicit REFIT_BASIS always wins)."
long_description = """
Flexible-basis family used by `tadah refit`: Blip, Blip5, Knot3, Knot5,
KnotMix or Gaussian; the default is Knot5 in compact mode and Blip in dense
mode (an explicit REFIT_BASIS always wins).

- 'Blip' (cubic B-spline bumps, C2; dense AND compact modes)
- 'Blip5' (M6 quintic B-spline bumps, C4, local support; dense AND compact;
  its accuracy depends on the material, so a Blip5 potential needs comparing
  with the input EAM file)
- 'Knot3' (one-sided CUBIC knot functions (t-r)_+^3 — the Mendelev/Ackland
  form, exact for knotted-cubic source tables; compact only)
- 'Knot5' (one-sided QUINTIC knot functions, C4; the recommended family in
  compact mode; compact only)
- 'KnotMix' (EXPERIMENTAL auto mode: quintic knot atoms by default, cubic
  atoms inserted where they win the per-insertion energy contest. The cubic
  atoms can degrade the elastic constants compared with pure Knot5, which is
  preferable unless the energy-volume curve is the only target; compact only)
- 'Gaussian' (EXPERIMENTAL/UNVALIDATED for refit; a Gaussian never vanishes,
  so without DESCRIPTOR blocks the refit fits and writes the pair function and
  the density with the smooth cutoff Cut_Poly at the table's rcut (RCTYPE2B
  Cut_Poly, the density's CUTOFF TYPE Cut_Poly): a DM_Embed Gaussian density
  needs a real smooth cutoff; dense mode only — any other family is
  preferable).

Spellings: Blip, BLIP, blip; Blip5, BLIP5, blip5, M6; Knot5, KNOT5, knot5,
Knot3, KNOT3, knot3, KnotMix, KNOTMIX, knotmix, Mixed, MIXED; Gaussian,
gaussian, BP, D2_BP. Another spelling names no family and is refused before
the EAM file is read. Compact-only families need a tadah built with
TADAH_ENABLE_NFP and TADAH_ENABLE_CERES.

For `tadah hpo`: a Knot* potential has no width keys (no SGRID2B; a knot
has no width), so an OPTIM SGRID2B line is refused; the knot density and
embedding of the written DM_Embed component have no widths either.
"""
