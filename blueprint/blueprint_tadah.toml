[ALLOWED_KEYS.OALGO]
value_type   = ["INT", "INT DOUBLE"]
value_format = ["<option>", "<option> <value>"]
default_value = ["1"]
value_N = [-2]
description = '''
This key controls the optimisation algorithm that trains the model. The **default algorithm** is **Option 1 (GELSD)** with a conditioning parameter (:math:`rcond`) of :math:`1 \times 10^{-8}`. The regularisation parameter is handled separately by the :ref:`LAMBDA` key.

Available options:

**1** - **GELSD**: Uses the LAPACK routine :code:`DGELSD` to solve linear least squares problems using the Singular Value Decomposition (SVD). This method is robust and can handle rank-deficient systems. It computes the minimum-norm solution and is suitable for ill-conditioned problems. The second value :code:`M` (:math:`\text{rcond}`, default :math:`1 \times 10^{-8}`) is the rank threshold: for :math:`0 < M < 1`, :code:`DGELSD` leaves out of the coefficients every singular direction whose singular value is at most :code:`M` times the largest. A negative :code:`M` takes the machine precision of LAPACK, :math:`2^{-53} \approx 1.1 \times 10^{-16}`, which can let directions at the rounding level of an ill-conditioned design matrix into the solution. A fit refuses an :code:`M` of 0 or of 1 or more, which :code:`DGELSD` replaces by the machine precision.

**2** - **GELS**: Uses the LAPACK routine :code:`DGELS` to solve linear least squares problems via QR or LQ factorisation. This method assumes that the matrix has full rank and is the fastest among the options. It is suitable for well-conditioned problems but less robust for ill-conditioned or rank-deficient matrices.

**3** - **SVD solve**: Solves the least-squares problem through the singular value decomposition of the design matrix. This method allows the use of the evidence approximation algorithm (:ref:`LAMBDA` -1). The second value :code:`M` (:math:`\text{rcond}`, default :math:`1 \times 10^{-8}`) is the rank threshold: for :math:`0 < M < 1`, the solve leaves out of the coefficients every singular direction whose singular value is at most :code:`M` times the largest. An :code:`M` of 0 or less leaves out only the directions of singular value 0 and keeps every other one, also one at the rounding level of an ill-conditioned design matrix, which with :ref:`LAMBDA` 0 can give very large coefficients. A fit refuses an :code:`M` of 1 or more, which would leave out every direction. At :ref:`LAMBDA` 0, a kept singular value whose square underflows to 0 in double precision gives a coefficient that is not finite, which the fit refuses, naming that singular value. A :ref:`LAMBDA` above 0 keeps the coefficient finite, and an :code:`M` of at least the ratio of that singular value to the largest leaves its direction out (the default :code:`M` does for a ratio of at most :math:`1 \times 10^{-8}`).

**4** - **Cholesky Decomposition**: Solves the normal equations :math:`A^\top A x = A^\top b` using Cholesky decomposition. This method is efficient for well-conditioned, full-rank matrices but may be less stable for ill-conditioned or rank-deficient problems because it squares the condition number of the matrix. It takes no second value.

**Performance Comparison**:

- **Option 2** is the fastest but assumes a full-rank matrix and is less robust for ill-conditioned problems.
- **Option 4** is also efficient but may suffer from numerical instability in ill-conditioned or rank-deficient problems due to squaring of the condition number.
- **Option 1** offers a balance between speed and robustness, handling rank-deficient and ill-conditioned problems better than options 2 and 4.
- **Option 3** computes the full SVD of the design matrix, which the evidence approximation (:ref:`LAMBDA` -1) needs.

**Usage**:

- The :code:`OALGO` key followed by the option number selects an algorithm.
- Options **1** and **3** take the conditioning parameter :code:`M` after the option number.
- Options **2** and **4** take no second value: a fit refuses one, as it refuses an option other than 1 to 4.

**Regularisation Parameter**:

- The regularisation parameter is controlled by the :ref:`LAMBDA` key, which should be set separately to apply regularisation to the model.

**Examples**:

- :code:`OALGO 1`          # Uses GELSD with default conditioning parameter (:code:`M = 1e-8`)
- :code:`OALGO 1 -1`       # Uses GELSD with machine precision (:code:`M = -1`)
- :code:`OALGO 2`          # Uses GELS
- :code:`OALGO 3 1e-10`    # Uses the SVD solve with :code:`M = 1e-10`
- :code:`OALGO 4`          # Uses Cholesky Decomposition

**Notes**:

- **Conditioning Parameter** :code:`M`: Controls the reciprocal of the condition number (:math:`\text{rcond}`). A smaller :code:`M` (closer to machine precision) includes more singular values in the solution, which may be necessary for certain problems but can introduce instability if the matrix is ill-conditioned.
- **A threshold below 0** (:code:`M = -1`): option **1** then uses the machine precision, and option **3** keeps every singular value above 0 (as with :code:`M = 0`). Either can let negligible singular values into the solution of an ill-conditioned problem; a positive :code:`M` below 1 is the recommended choice.
- **Dropped directions**: Option **3** leaves out of the coefficients every singular direction of the design matrix at or below the rank threshold (singular value at most :code:`M` times the largest, or 0 for an :code:`M` of 0 or less); a WARNING gives their number.
- **Coefficients that are not finite**: a fit refuses them under every option, naming the :code:`OALGO` line and the first such coefficient.
- **Cholesky Decomposition**: Option **4** solves the normal equations using Cholesky decomposition. It is efficient but may be numerically unstable for ill-conditioned or rank-deficient problems due to squaring the condition number. It is best used when the matrix is well-conditioned and of full rank.
- **A design matrix without full column rank**: options **2** and **4** refuse a design matrix whose rows cannot give it full column rank. The refusal comes before any LAPACK routine runs and applies in two cases.

  - With :ref:`LAMBDA` 0: fewer non-zero data rows (energies, forces and stresses) than coefficients.
  - With :ref:`LAMBDA` > 0, which penalises every coefficient but the intercepts of :ref:`BIAS`: fewer non-zero data rows than intercepts.

  A data row that is zero in every column adds nothing to the rank. Such a row has priority 0, as every energy row under :ref:`ENERGY` false, has all its values in :ref:`FIXINDEX` columns, or is made zero by the descriptors, as the y and z force rows of a dimer along x or, with :ref:`BIAS` false, the energy of an atom without neighbours.

  Beyond that, option **2** stops when its QR factorisation meets an exactly zero diagonal element, which is a column that is zero for every structure or exactly a combination of the columns before it in floating point. Option **4** stops when the Cholesky factorisation of :math:`A^\top A` meets a pivot that is not positive.

  Training then stops with a message. It names the data rows (and, when some are zero, how many are not) and the coefficients (and the column where LAPACK stopped). It also names the remedies that apply to the fit.

  - With :ref:`LAMBDA` 0: option **1** or **3**, which give the minimum-norm coefficients, :ref:`LAMBDA` > 0, or more data.
  - With :ref:`LAMBDA` > 0: option **1** (and, for option **4**, option **2**, which does not form :math:`A^\top A`), option **3** only without intercepts of :ref:`BIAS` (it refuses them with :ref:`LAMBDA` != 0), a larger :ref:`LAMBDA`, or more data.

  A column that depends on others, or nearly does, without being exactly a combination of them in floating point, is still fitted by options **2** and **4**, with very large coefficients. Option **1** or **3**, or :ref:`LAMBDA` > 0, is the recommended choice when the data may not determine every coefficient.

  A design matrix or target that holds NaN or an infinity is refused under every option, naming its row and column, before any LAPACK routine runs.

**Additional Information**:

- **Regularisation with** :ref:`LAMBDA`:

  - The :ref:`LAMBDA` key controls the regularisation parameter used in the training process. It should be specified separately to apply regularisation to the model.
  - Regularisation helps prevent overfitting by adding a penalty for larger coefficients.

- **LAPACK Routines**:

  - :code:`DGELSD`: Computes the minimum-norm solution to a real linear least squares problem using the SVD of the coefficient matrix.
  - :code:`DGELS`: Solves overdetermined or underdetermined real linear systems involving an :math:`M \times N` matrix, using a QR or LQ factorisation of the matrix.
  - :code:`DPOTRF` and :code:`DPOTRS`: Used in the Cholesky decomposition to factorise a symmetric positive-definite matrix and solve the resulting linear system.

- **When to Use Each Option**:

  - **Option 1 (GELSD)** suits a fit that needs robustness against rank deficiency and moderate performance.
  - **Option 2 (GELS)** gives the fastest performance on well-conditioned, full-rank matrices where robustness is less of a concern.
  - **Option 3 (SVD solve)** is the option of the evidence approximation (:ref:`LAMBDA` -1).
  - **Option 4 (Cholesky Decomposition)** suits a well-conditioned, full-rank matrix that needs an efficient solution; it can be numerically unstable in ill-conditioned or rank-deficient problems.

'''
examples = ["1", "1 -1", "2", "3 1e-10", "4"]


[ALLOWED_KEYS.SBASIS]
INHERIT = ["TYPES.UINT"]
description = "Number of basis vectors an M_KRR fit draws (a non-linear kernel, or implementation 2)."
long_description = """
Required by M_KRR with every kernel but Kern_Linear, and by M_KRR Kern_Linear
implementation 2 (MODEL), and ignored by the other models. A non-linear
kernel's model is E_i = sum_j w_j K(b_j, x_i) over SBASIS basis vectors
b_j, one coefficient w_j each; Kern_Linear implementation 2 solves for the
coefficients of SBASIS basis vectors and keeps the descriptor coefficients
they make, one per descriptor component. The first n columns are the intercept ("bias")
vectors e_0 .. e_(n-1) (e_k is 1 in component k, 0 elsewhere): with BIAS
true one per ATOM species, n = size(ATOM); else n = 1, the bias vector
e0 = (1, 0, ..., 0). The other SBASIS-n are drawn from the training data:
atomic energy descriptors (implementation 1, MODEL) or the mean
descriptors of whole structures (implementation 2). SBASIS must be at least
n+1 (2 with one species or BIAS false) and at most the number of candidates
plus n (SBASIS-n candidates are drawn, each once).

The draw is fixed: a partial Fisher-Yates shuffle of the candidates, in
the order of the training set, driven by the raw output of std::mt19937_64
with its default seed (5489). The same training set and SBASIS give the
same basis on every run and platform, so `tadah train` is reproducible and
the loss of `tadah hpo` at a given point does not depend on the draw.

`tadah train` writes SBASIS and the basis vectors (BASIS) into the
potential with the coefficients (key WEIGHTS; Kern_Linear: SBASIS alone,
its coefficients being descriptor coefficients). A fit draws its basis anew: the BASIS of a
potential used as a training configuration is not read, so it may be
retrained with another SBASIS. SBASIS is an integer. A missing SBASIS, or
one below n+1, is refused naming the model (M_KRR <kernel> <implementation>):
by `tadah train` before it reads the training data (with BIAS true and no
ATOM, once ATOM is set from the datasets), and by `tadah hpo` at startup.
`tadah hpo` refuses `OPTIM SBASIS` at its line.
"""
examples = ["10", "102"]

[ALLOWED_KEYS.NORM]
INHERIT = ["TYPES.BOOL"]
description = "Standardises the descriptors."
long_description = """
NORM true standardises the descriptors, which is typically relevant when
energies are used for fitting. With a linear model (BF_Linear, Kern_Linear)
NORM true requires BIAS true: the coefficients fitted to the standardised
descriptors are converted to coefficients of the raw descriptors, and the
constant this moves goes into the intercept columns. A linear potential with
NORM true and BIAS false has no intercept column for that constant. It is
refused when it predicts (tadah predict, pair_style tadah) and needs
retraining with BIAS true or NORM false.
"""

[ALLOWED_KEYS.LAMBDA]
default_value = ["0"]
value_type = ["INT","DOUBLE","INT DOUBLE"]
value_format = ["<int>", "<double>", "<int> <double> (read in a potential that holds a second value; a fit refuses it)"]
value_N = [-2]
description = "Controls the regularisation parameter λ for BLR and KRR."
long_description = """
LAMBDA 0 fits without regularisation, and a positive LAMBDA is λ. λ weighs
the coefficients against the sum of the observations, each scaled by its
error scale (the page :ref:`What a Fit Minimises <fit_objective>` of the
documentation describes it): every error scale multiplied by c fits as
LAMBDA multiplied by c^2.

LAMBDA -1 requests the evidence approximation, which estimates λ (OALGO 3
only). It iterates alpha = gamma/(w.w) and beta = (n_obs - gamma)/RSS to
λ = alpha/beta, over the singular directions the solve keeps. Here n_obs is
the number of observations (the rows of the design matrix with a priority
above 0 that are not zero in every column), and gamma is the number of
effective parameters (the number of coefficients the data determine). The
iteration converges when the relative changes of alpha and beta both fall
below 5e-12. After 41 iterations it stops, a WARNING names the last changes,
and the fit takes the last alpha and beta.

Targets that make alpha or beta infinite (all zero: no coefficient and no
residual) are refused. At VERBOSE 2 the log lists its iterations and how
it ended.

LAMBDA takes one value. Every fit refuses, before it solves, a negative
value other than -1, which requests nothing, LAMBDA -1 with an OALGO other
than 3, and a second value: the rank threshold of OALGO 1 and 3 is OALGO's
second value. A potential with a second value loads (prediction does not
read LAMBDA); a retrain from it is refused. tadah hpo, whose evaluations
each fit, refuses such a LAMBDA when the run starts; its journal,
hpo_run.log, gives the WARNING of the iteration limit once per run, and a
candidate whose targets the evidence approximation refuses fails its
evaluation.

The penalty (λ times the sum of the squared coefficients) leaves out the
coefficients of the model's intercept columns, the columns that depend on an
atom only through its species, and penalises every other coefficient, also when
FIXINDEX pins some: with BIAS true and ATOM (N species), the intercept
columns of the descriptor for BF_Linear and Kern_Linear, the products (k,k)
of each intercept component with itself for BF_Polynomial2 (column 0 with
one species), and columns 0 to N-1 (the intercept basis vectors e_k) for
Kern_Quadratic, Kern_LQ, Kern_Polynomial and Kern_Sigmoid; Kern_RBF has
none. OALGO 3 penalises every column alike and refuses λ != 0 for a fit
with an intercept column that FIXINDEX does not pin, LAMBDA -1 included:
the evidence approximation needs BIAS false, or every intercept coefficient
pinned with FIXINDEX and FIXWEIGHT. tadah hpo refuses such a setup, and
OPTIM LAMBDA with it, when the run starts.
"""
examples = ["-1", "1e-4", "0"]

