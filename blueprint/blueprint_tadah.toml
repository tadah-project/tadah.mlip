[ALLOWED_KEYS.refit_curve_weighting]
command_only = true
INHERIT = ["TYPES.BOOL"]
# Explicit default_value true OVERRIDES the inherited TYPES.BOOL default (false):
# the Context injects this default whenever the key is queried, so the engine's
# bget() sees `true` unless the user sets the key. Without it weighting would
# silently default OFF (the inherited false would be injected).
default_value = ["true"]
description  = "`tadah refit` compact mode, REFIT_OBJECTIVE curve only: pressure-relaxed curve weighting (on by default), which concentrates the fit on the range of r and rho that the crystal samples near ambient pressure. false gives uniform weighting; REFIT_MODE dense, and REFIT_OBJECTIVE energy (written or the default), refuse the key."
long_description = """
`tadah refit` compact mode, REFIT_OBJECTIVE curve only: pressure-relaxed curve
weighting (on by default), which concentrates the fit on the range of r and
rho that the crystal samples near ambient pressure. false gives uniform
weighting; REFIT_MODE dense, and REFIT_OBJECTIVE energy (written or the
default), refuse the key.

The weighting relaxes toward the high-pressure extremes, so a fixed knot
budget gives most of its accuracy to the ambient range. phi(r) and rho(r)
are weighted 1 between the ambient nearest-neighbour distance r_amb and the
cutoff, and ramp smoothly down to REFIT_CURVE_RELAX toward smaller r
(compression). F(rho) is weighted 1 from rho = 0 up to the ambient density
rho_amb, and ramps down to the same floor for higher rho (compression).
r_amb and rho_amb are derived from the lattice geometry and the EAM tables
alone, without the crystal energy-volume scan.

The weights apply to both the stacked value + d1 + d2 coefficient solve and
the rung-selection metrics, so fit and selection agree. They multiply with
REFIT_CURVE_DERIV_WEIGHT: that key scales the derivative terms against the
value, this one scales each region. With false (uniform weighting)
REFIT_CURVE_RELAX, the floor of the weighting, is refused. Under
REFIT_OBJECTIVE energy the key has no effect.
"""
examples     = ["true", "false"]
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

