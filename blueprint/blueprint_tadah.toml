description = """Stress standard deviation."""
value_N = [-6]

###############################################################################
# Task Blueprint (TASKS)
###############################################################################

[TASKS.train]
description      = "Trains a model."
long_description = """
Trains a model from a training configuration. By default, it trains on
energies; however, forces and stresses can also be included.
This command requires a training configuration and yields a trained interatomic
potential which can be used with Tadah! or for molecular
dynamics simulations in LAMMPS via pair_style tadah.

After the fit, it prints the balance table of the fit (at VERBOSE 1 and
above, with the legend of its columns) and writes it at the end of the
training record of the potential: the error scales, and per quantity and
dataset the observations, the RMSE, the root mean square of residual over
error scale, the share of the minimised sum and the effective parameters
(the section The balance table of the page What a Fit Minimises of the
documentation). The table costs one pass over the n rows and p
coefficients of the fit, of the order of n p^2 like the solve, and memory
of the order of p^2, of a block of 1024 rows and of three rows per dataset,
not a copy of the rows.
"""
examples         = ["tadah train -c config.tadah", "tadah train -c config.tadah --force --stress", "tadah train -c config.tadah --verbose 2 --outfile potential.tadah"]
[TASKS.train.keys]
INHERIT          = ["ALLOWED_KEYS.verbose", "ALLOWED_KEYS.force", "ALLOWED_KEYS.stress", "ALLOWED_KEYS.uncertainty", "ALLOWED_KEYS.outfile", "ALLOWED_KEYS.lscale", "ALLOWED_KEYS.eshift", "ALLOWED_KEYS.eshift_atom", "ALLOWED_KEYS.eshift_dbatom", "ALLOWED_KEYS.efilter", "ALLOWED_KEYS.ffilter", "ALLOWED_KEYS.wdbfile", "ALLOWED_KEYS.wdbfile_auto", "ALLOWED_KEYS.eweight_temp", "ALLOWED_KEYS.zero_com_force"]
[TASKS.train.keys.outfile]
default_value = ["pot.tadah"]
value_N = [1]
description = "Output file name for the trained model."
long_description = """
Output file name for the trained model. 
"""
value_type   = ["STRING"]
value_format = ["<file>"]
[TASKS.train.groups.input]
description      = "The training configuration file."
required_min = 1
required_max = 1
[TASKS.train.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config"]

[TASKS.refit]
description      = "Refits a tabulated EAM potential into a native Tadah model."
long_description = """
Converts a tabulated EAM potential (setfl format: eam/alloy or eam/fs, single
element) into a native Tadah model: the pair, density and embedding functions
are re-fitted with flexible Tadah basis functions. The result can be used
directly or tuned further with `tadah hpo`.

Output files (default name, config key):
- pot.tadah (OUTFILE, -o): the fitted Tadah potential, for `tadah predict`,
  LAMMPS pair_style tadah, and as the seed for `tadah hpo`. Its many-body
  term is a DM_Embed component (DESCRIPTOR eam DM_Embed ... ENDDESCRIPTOR,
  referenced as @eam; the ID of the configuration's block when it declares
  one), whose DENSITY block has the density form (FORM) and whose
  EMBEDDING block the embedding reference (REFERENCE). A potential with a
  DM_REAM term (AMPGRIDMB, RHOFORM, EMBF0 and the other DM_REAM key lines)
  loads, and --edit edits it. The lines of the retired keys of the input
  stay in the edited potential as they are, and the edit adds no line of
  the error scales: a fit refuses the edited potential as it refuses its input, with
  the conversion.
- refit.eam (SETFL_OUT): setfl table rebuilt from the fitted functions, for
  side-by-side comparison with the input potential in LAMMPS.
- refit.hpotarget (HPOFILEOUT, --hpofileout): ready-to-run `tadah hpo` target
  file with search bounds around the fitted parameters; the many-body
  parameters are named by component path (EAM.DENSITY.CENTRES, ...).
- refit_opt.log (REFIT_LOG): live fit log, updated during the run.
- refit_curve_{phi,rho,F}.dat, refit_compare.dat, refit_range_report.dat:
  diagnostics with fitted vs original curves, residuals, fit windows.

Config-file options (EAM is required, and RHOFORM without DESCRIPTOR
blocks; a configuration with a DM_Embed block declares the density and
embedding in it, as the DM_Embed page of the documentation describes):
- EAM <file>: input setfl potential to refit (required).
- RHOFORM SIGNED|NONNEG|MONOTONE (required without DESCRIPTOR blocks): the
  density form of the written potential (its component's FORM). SIGNED
  fits amplitudes of either sign; NONNEG fits non-negative amplitudes
  (rho >= 0); MONOTONE fits
  integrated-bump steps with non-negative amplitudes (rho >= 0 and
  non-increasing). Every form fits in both REFIT_MODEs. MONOTONE needs a
  bump basis: REFIT_BASIS Blip or Blip5, since the compact default is
  Knot5 (Gaussian works with REFIT_MODE dense only). NONNEG with a knot
  basis fits only non-increasing convex densities; REFIT_BASIS Blip5 lifts
  that lock.
  A table the form cannot follow (NONNEG: rho < 0 in the fit window;
  MONOTONE: a rising rho) is refused before fitting.
- REFIT_MODE: compact (default; small optimised basis) | dense (fast
  fixed grids), in any letter case. A key that only the other mode reads
  is an error naming it and that mode (e.g. N2B under compact, a REFINE
  block under dense). A tadah built without the compact fitter
  (TADAH_ENABLE_NFP and TADAH_ENABLE_CERES) refuses compact mode, written
  or the default: REFIT_MODE dense is needed there.
- REFIT_BASIS: basis family. Knot5 (compact default) | Blip (dense
  default) | Blip5 | Knot3 | KnotMix.
- REFIT_TOL_AMBIENT / REFIT_TOL_COMPRESSED: accuracy targets in meV/atom
  near equilibrium / under compression (defaults 0.1 / 1.0).
- REFIT_REACH_SMIN: smallest compression a/a0 the fit must stay accurate
  at (default 0.75).
- OPTIM_PCT: +-percent search bounds written to the target file
  (default 5).
- OUTPUT_GRID_SCALE: output setfl grid density relative to the input
  (default 1.0).
- The numbers are read strictly before the EAM file, each within its range
  (`tadah explain refit.<key>`): e.g. the tolerances, OPTIM_PCT and
  OUTPUT_GRID_SCALE > 0, REFIT_REACH_SMIN from 0.1 to 1,
  REFIT_COMPACT_SEED 0 to 4294967295; an error names the key and the
  value.
- Dense mode only: REFIT_LEVEL (coarse|balanced|fine|accurate), N2B,
  NRHO_BASIS, NF_BASIS, REFIT_MAX_ESCALATIONS, REFIT_PLACEMENT,
  REFIT_CONSTRAIN_F0 (EMBF0 FREE only).
- Compact mode only: the ladder (REFIT_COMPACT_NMAX, REFIT_COMPACT_STALL,
  REFIT_COMPACT_SHARE, REFIT_COMPACT_SEED and the other REFIT_COMPACT_*
  keys; REFIT_COMPACT_OPT_EVERY, REFIT_COMPACT_INSERT_TOPK and
  REFIT_COMPACT_MERGE with a knot basis only), REFIT_OBJECTIVE
  curve and REFIT_CURVE_* (under REFIT_OBJECTIVE curve only;
  REFIT_CURVE_RELAX with REFIT_CURVE_WEIGHTING true only), and the stage
  blocks below.
- Stage pipeline (compact mode): INIT -> EXPLORE -> REFINE -> FUSE, each its
  own multi-line block. INIT (no optimisation) declares manual/anchored,
  optionally PINned knots/blips. EXPLORE/REFINE/FUSE each take a nested
  OPTIMIZER block with ALGO (required), LIB (required with an ALGO that
  runs an optimiser, naming its library) and the stage's stop criteria,
  written as in `tadah hpo`; a key its ALGO does not read is an error.
  An omitted block takes its defaults (default EXPLORE = global MLSL + inner
  SBPLX). The Refitting page of the documentation has examples (Stage
  blocks).
- Embedding reference: EMBF0 ZERO|FREE (default ZERO; without DESCRIPTOR
  blocks) — the written potential's embedding reference (its component's
  REFERENCE). ZERO fits the zero-referenced
  embedding F(rho) - F(0) against F_tab(rho) - F_tab(0) (refit.eam F[0] = 0);
  FREE fits the raw embedding F(rho) against F_tab(rho). `--edit` edits F in the
  input potential's reference and writes it.
- Advanced: REFIT_REACH_MARGIN, REFIT_R_LO_FRAC.

Two additional modes operate on EXISTING refit outputs instead of a
tabulated EAM file:
- --edit <pot.tadah>: adds or removes one basis function of one curve
  (--func {phi|rho|F} with --add <centre> or --remove <centre>). Adding
  uses a zero coefficient, so the potential is unchanged until `tadah hpo`
  varies the inserted coefficient (exact unless a NUMERIC below 17 is set for the
  run; a NUMERIC line of the input is not read); removing compensates
  via the neighbouring coefficients (under RHOFORM NONNEG or MONOTONE
  they stay >= 0). A DM_REAM input must declare RHOFORM, which the edited
  potential keeps; a DM_Embed input keeps its component's FORM, REFERENCE,
  families and coordinates. Writes an edited potential and a regenerated
  target file.
- --retarget <file.hpotarget>: rewrites the OPTIM search bounds of an
  existing target file (--pct global or KEY=N per-key percentages,
  --set 'KEY(i)=lo,hi' absolute overrides, --in-place, and --rhoform
  SIGNED|NONNEG|MONOTONE for the density form of a DM_REAM potential the
  file searches around: non-negative AMPGRIDMB boxes and the RHOFORM header
  line under NONNEG/MONOTONE; a target of DM_Embed component paths only
  refuses --rhoform and --rcutmb, the component's FORM and CUTOFF RADIUS
  being its potential's). A configuration may not set RHOFORM, EMBF0 or
  NUMERIC for --retarget (no effect on a target file: NUMERIC governs only
  the potential a refit and --edit write); for --edit it may set RHOFORM and
  EMBF0 only to the potential's own values.
A configuration for --edit or --retarget may not set a key that only a
refit of an EAM file reads (REFIT_*, N2B, NRHO_BASIS, NF_BASIS,
OUTPUT_GRID_SCALE, SETFL_OUT, the stage blocks; for --retarget also
HPOFILEOUT, which --edit reads): it is an error naming the key and what
reads it.
For a line of one knot descriptor both modes keep RCUT2B/RCUTMB
consistent with the largest knot position (the true effective cutoff);
--edit keeps the stated cutoffs of a D2_mJoin or DM_mJoin line, with which
its coefficients were fitted.

`tadah explain refit.<key>` (e.g. `tadah explain refit.refit_mode`) or
`tadah explain <KEY>` (e.g. `tadah explain RHOFORM`) prints the full
description of a configuration key above, including those that are no
options of tadah refit: RHOFORM, EMBF0 and NUMERIC (keys a configuration may
set, but not for --retarget) and RCUT2B, RCUTMB and AMPGRIDMB (keys of the
potential). The keys
written inside a stage block are no configuration keys:
`tadah explain refit.optimizer` describes those of an OPTIMIZER block (ALGO,
LIB and the stopping criteria) and `tadah explain refit.init` the
placements of INIT, as does the Refitting page of the documentation (Stage
blocks).
"""
examples         = ["tadah refit -c refit.cfg", "tadah refit -c refit.cfg -v 2", "tadah refit --edit pot.tadah --func phi --add 2.75", "tadah refit --edit pot.tadah --func F --remove 0.9", "tadah refit --retarget refit.hpotarget --pct 10 FIXWEIGHT=2", "tadah refit --retarget refit.hpotarget --pct 10 --rcut2b 6.0 --rcutmb 6.0 -o wide.hpotarget", "tadah refit --retarget refit.hpotarget --set 'CGRID2B(3)=2.1,2.4' --in-place"]
[TASKS.refit.keys]
INHERIT          = ["ALLOWED_KEYS.verbose", "ALLOWED_KEYS.outfile", "ALLOWED_KEYS.setfl_out", "ALLOWED_KEYS.refit_basis", "ALLOWED_KEYS.refit_pair_basis", "ALLOWED_KEYS.refit_level", "ALLOWED_KEYS.n2b", "ALLOWED_KEYS.nrho_basis", "ALLOWED_KEYS.nf_basis", "ALLOWED_KEYS.optim_pct", "ALLOWED_KEYS.output_grid_scale", "ALLOWED_KEYS.hpofileout", "ALLOWED_KEYS.refit_tol_ambient", "ALLOWED_KEYS.refit_tol_compressed", "ALLOWED_KEYS.refit_max_escalations", "ALLOWED_KEYS.refit_component_iterations", "ALLOWED_KEYS.refit_placement", "ALLOWED_KEYS.refit_reach_smin", "ALLOWED_KEYS.refit_reach_margin", "ALLOWED_KEYS.refit_constrain_f0", "ALLOWED_KEYS.refit_r_lo_frac", "ALLOWED_KEYS.refit_mode", "ALLOWED_KEYS.refit_log", "ALLOWED_KEYS.refit_compact_nmax", "ALLOWED_KEYS.refit_compact_opt_every", "ALLOWED_KEYS.refit_compact_stall", "ALLOWED_KEYS.refit_compact_insert_topk", "ALLOWED_KEYS.refit_compact_share", "ALLOWED_KEYS.refit_compact_seed", "ALLOWED_KEYS.refit_compact_samples", "ALLOWED_KEYS.refit_compact_jitters", "ALLOWED_KEYS.refit_compact_merge", "ALLOWED_KEYS.refit_objective", "ALLOWED_KEYS.refit_curve_deriv_weight", "ALLOWED_KEYS.refit_curve_weighting", "ALLOWED_KEYS.refit_curve_relax", "ALLOWED_KEYS.optimizer", "ALLOWED_KEYS.init", "ALLOWED_KEYS.explore", "ALLOWED_KEYS.refine", "ALLOWED_KEYS.fuse", "ALLOWED_KEYS.func", "ALLOWED_KEYS.add", "ALLOWED_KEYS.remove", "ALLOWED_KEYS.eta", "ALLOWED_KEYS.deg", "ALLOWED_KEYS.pct", "ALLOWED_KEYS.set", "ALLOWED_KEYS.retarget_rcut2b", "ALLOWED_KEYS.retarget_rcutmb", "ALLOWED_KEYS.retarget_rhoform", "ALLOWED_KEYS.in_place"]
[TASKS.refit.keys.outfile]
default_value = ["pot.tadah"]
value_N = [1]
value_type   = ["STRING"]
value_format = ["<file>"]
description = "Output file name for the fitted native Tadah potential."
[TASKS.refit.keys.hpofileout]
default_value = ["refit.hpotarget"]
description = "Output file name for the generated `tadah hpo` starter target file (a refit and --edit; --retarget, whose output is -o, refuses it)."
[TASKS.refit.keys.func]
