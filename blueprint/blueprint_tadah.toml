When a retrain or a tadah hpo run reads a potential (a file with WEIGHTS,
given with -c or included with CONFIG), the WDBFILE line of the potential is
not read, so a retrain may list any datasets. A WARNING names the line when
the run gives no WDBFILE of its own. The run's own WDBFILE (--wdbfile, or a
