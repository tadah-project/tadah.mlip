stages:
  - lint
  - build_debug
  - build_release
  - trigger
  - release

# Base address of the Tadah! repositories that CMake's FetchContent and the
# clones below use: the group of this project on the server running the
# pipeline. A group or project CI/CD variable of the same name takes
# precedence (e.g. an address with a job token).
variables:
  TADAH_GIT_BASE: "${CI_SERVER_URL}/${CI_PROJECT_NAMESPACE}"

cache:
    key: "build-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - ${BUILD_DIR}
  
before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_SHARED_DIR}
  - mkdir -p ${RELEASE_STATIC_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build_debug:
  stage: build_debug
  script:
    - cd ${DEBUG_DIR}
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DBUILD_TESTING=ON
    - make -j ${CPU_BUILD}
    - ctest --output-on-failure
    # Return to the repo root so --root . aligns with actual paths:
    - cd "${CI_PROJECT_DIR}"
    # Run gcovr in a more permissive way:
    - |
      gcovr \
        --root . \
        --object-directory build/debug \
        --exclude '.*CompilerIdCXX.*' \
        --exclude '.*build\/debug\/CMakeFiles\/3.*' \
        --exclude '.*CMakeFiles.*' \
        --exclude 'tests' \
        --exclude 'build' \
        --exclude 'external' \
        --gcov-ignore-errors=no_working_dir_found \
  coverage: "/^TOTAL.*\\s+(\\d+\\%)$/"

build_release_shared:
  stage: build_release
  resource_group: build_release
  script:
    - cd ${RELEASE_SHARED_DIR}
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

build_release_static:
  stage: build_release
  resource_group: build_release
  script:
    - cd ${RELEASE_STATIC_DIR}
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

trigger:
  stage: trigger
  resource_group: models-$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  trigger:
    project: tadah/models
    branch: $CI_COMMIT_REF_NAME

# ---- Lint (codespell) ---------------------------------------------------
lint_codespell:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      if ! command -v codespell; then
        python3 -m ensurepip --user --upgrade >/dev/null 2>&1 || true
        python3 -m pip install --user codespell >/dev/null 2>&1 || {
          echo "[lint_codespell] codespell unavailable in this runner image; skipping"
          exit 0
        }
      fi
      export PATH="$HOME/.local/bin:$PATH"
      codespell \
        --skip='./build*,./external,./_deps,./*.toml,./tests/data,./blueprint/blueprint_tadah.toml' \
        --ignore-words-list='Te,CONFING,re-use,re-uses,re-used,re-using,nd,SEH,ReflectIn,accessS' \
        || true
  allow_failure: true

# ---- Source-tarball release (tag-gated) --------------------------------
release_tarball:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - export TARBALL="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.gz"
    - git archive --format=tar.gz
        --prefix="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}/"
        -o "${TARBALL}" HEAD
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file "${TARBALL}"
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${TARBALL}"'
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 week
