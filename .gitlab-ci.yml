stages:
  - lint
  - build_debug
  - build_release
  - docs
  - release

cache:
    key: "build-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - ${BUILD_DIR}
  
before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_SHARED_DIR}
  - mkdir -p ${RELEASE_STATIC_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build_debug:
  stage: build_debug
  script:
    - cd ${DEBUG_DIR}
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
    - make -j ${CPU_BUILD}
    - ctest --output-on-failure
    - cd ..; gcovr -e '.*tests.*|external|.*docs.*|.*examples.*|.*scripts.*|.*/_deps/(dlib|nlopt|Eigen|ceres|boost|catch2|tadah_cmake)[a-z0-9_-]*-src|build' -r .
  coverage: /^TOTAL.*\s+(\d+\%)$/

build_release_shared:
  stage: build_release
  resource_group: build_release
  script:
    - cd ${RELEASE_SHARED_DIR}
    - export PATH=${INSTALL_PATH}/bin:$PATH
    - export CPATH=${INSTALL_PATH}/include:$CPATH
    - export LD_LIBRARY_PATH=${INSTALL_PATH}/lib:$LD_LIBRARY_PATH
    - export LIBRARY_PATH=${INSTALL_PATH}/lib:$LIBRARY_PATH
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
    - make -j ${CPU_BUILD}
    - make install
# run basic cli commands    
    - ls -l ${INSTALL_PATH}/bin/tadah
    - ls -l ${INSTALL_PATH}/lib/libtadah*
    - echo $PATH
    - which tadah
    - tadah
    - tadah -h
    - ldd ${INSTALL_PATH}/bin/tadah
# run example 1
    - cd ${RELEASE_SHARED_DIR}
    - cp -r ../../examples/API/ex_1 .
    - cd ex_1
    - g++ -O3 ex1.cpp -ltadah.mlip -ltadah.models -ltadah.core -lblas -llapack -fopenmp -o a.shared
    - ./a.shared
    - bash EXPECTED_OUTPUT/compare.bash
    - if [ $? -ne 0 ]; then exit 1; fi
# run example 2  
    - cd ${RELEASE_SHARED_DIR}
    - cp -r ../../examples/API/ex_2 .
    - cd ex_2
    - g++ -O3 ex2.cpp -ltadah.mlip -ltadah.models -ltadah.core -lblas -llapack -fopenmp -o a.shared   
    - ./a.shared
    - bash EXPECTED_OUTPUT/compare.bash
    - if [ $? -ne 0 ]; then exit 1; fi

build_release_static:
  stage: build_release
  resource_group: build_release
  script:
    - cd ${RELEASE_STATIC_DIR}
    - export PATH=${INSTALL_PATH}/bin:$PATH
    - export CPATH=${INSTALL_PATH}/include:$CPATH
    - export LD_LIBRARY_PATH=${INSTALL_PATH}/lib:$LD_LIBRARY_PATH
    - export LIBRARY_PATH=${INSTALL_PATH}/lib:$LIBRARY_PATH
    - find . -name CMakeCache.txt -delete
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
    - make -j ${CPU_BUILD}
    - make install
# run basic cli commands    
    - ls -l ${INSTALL_PATH}/bin/tadah
    - ls -l ${INSTALL_PATH}/lib/libtadah*
    - echo $PATH
    - which tadah
    - tadah
    - tadah -h
    - ldd ${INSTALL_PATH}/bin/tadah
# run example 1
    - cd ${RELEASE_STATIC_DIR} 
    - cp -r ../../examples/API/ex_1 .
    - echo $CPATH
    - pwd
    - cd ex_1
    - echo $CPATH
    - g++ -O3 ex1.cpp -ltadah.mlip -ltadah.models -ltadah.core -lblas -llapack -fopenmp -o a.static
    - ./a.static
    - bash EXPECTED_OUTPUT/compare.bash
    - if [ $? -ne 0 ]; then exit 1; fi
# run example 2
    - cd ${RELEASE_STATIC_DIR}
    - cp -r ../../examples/API/ex_2 .
    - cd ex_2
    - g++ -O3 ex2.cpp -ltadah.mlip -ltadah.models -ltadah.core -lblas -llapack -fopenmp -o a.static
    - ./a.static
    - bash EXPECTED_OUTPUT/compare.bash
    - if [ $? -ne 0 ]; then exit 1; fi

# ---- Lint (codespell) ---------------------------------------------------
lint_codespell:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      if ! command -v codespell; then
        python3 -m ensurepip --user --upgrade >/dev/null 2>&1 || true
        python3 -m pip install --user codespell >/dev/null 2>&1 || {
          echo "[lint_codespell] codespell unavailable in this runner image; skipping"
          exit 0
        }
      fi
      export PATH="$HOME/.local/bin:$PATH"
      codespell \
        --skip='./build*,./external,./_deps,./examples,./docs/source/cli,./docs/source/spelling_wordlist.txt,./docs/source/config/blueprint_tadah.toml,./docs/source/config/config_keys.rst' \
        --ignore-words-list='daed,Te,CONFING,Strat,strat,MAPE,mape,lamda,lamdas,fof,struc,smae,eCounter,ue,cNa,unparseable,re-use,re-uses,re-used,re-using,nd,SEH' \
        || true
  allow_failure: true

# ---- Sphinx docs build (warnings = error) ------------------------------
docs_sphinx:
  stage: docs
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      # docs/requirements.txt, every time, into a virtual environment of the
      # job's own: a Sphinx the runner already has is not the one the build
      # is meant to use, and may lack the extensions the file lists.
      python3 -m venv "$CI_PROJECT_DIR/.docs-venv" || {
        echo "[docs_sphinx] python3 -m venv failed: the runner image needs Python's venv module (Debian/Ubuntu: python3-venv) to install docs/requirements.txt"
        exit 1
      }
      . "$CI_PROJECT_DIR/.docs-venv/bin/activate"
      python -m pip install -r docs/requirements.txt
      # Doxygen XML for breathe. TADAH_BUILD_DOCS_ONLY skips heavy library
      # probes so configure is light.
      cmake -S . -B build -DTADAH_BUILD_DOCS_ONLY=ON -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      cmake --build build --target docs
      export TADAH_DOXYGEN_XML_DIR="$CI_PROJECT_DIR/build/docs/xml"
      # The generated pages read CORE's blueprint and HPO's key registry
      # (docs/source/config/source_locator.py). Name both explicitly -- fresh
      # shallow clones of the branch being built, the ref CMake fetched the
      # modules at -- so a checkout left next to this one on the runner is
      # never picked up.
      docs_src="$(mktemp -d)"
      git clone --depth 1 --branch "$CI_COMMIT_REF_NAME" https://git.ecdf.ed.ac.uk/tadah/core.git "$docs_src/CORE"
      git clone --depth 1 --branch "$CI_COMMIT_REF_NAME" https://git.ecdf.ed.ac.uk/tadah/hpo.git "$docs_src/HPO"
      export TADAH_CORE_SOURCE_DIR="$docs_src/CORE" TADAH_HPO_SOURCE_DIR="$docs_src/HPO"
      # Locator and hpo.html redirect checks, then the build (conf.py runs
      # the page generators; its check_redirect extension checks hpo.html
      # against the built site).
      python3 -m unittest discover -s docs/tools/tests -v
      sphinx-build -W --keep-going -b html docs/source docs/build/html
  artifacts:
    when: on_failure
    paths:
      - docs/build/html
    expire_in: 1 week
  allow_failure: false

# ---- Source-tarball release (tag-gated) --------------------------------
release_tarball:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if ! command -v curl >/dev/null 2>&1; then
        echo "[release_tarball] curl missing from runner image; installing on-demand"
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache curl ca-certificates
        else
          echo "[release_tarball] no supported package manager (apt-get / apk); please rebuild the runner image with curl preinstalled" >&2
          exit 1
        fi
      fi
    - export TARBALL="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.gz"
    - git archive --format=tar.gz
        --prefix="${CI_PROJECT_NAME}-${CI_COMMIT_TAG}/"
        -o "${TARBALL}" HEAD
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
        --upload-file "${TARBALL}"
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${TARBALL}"'
