# The pages of the released site (1.0.0, 1.1.1, 1.3.0-beta.1 and 1.5.0) that
# the site no longer builds, and where each of their anchors leads: to the
# label of the section that holds its topic, to the id of a reference
# entry, or to the label of a page when no section of it holds the topic
# alone. Paths start at the HTML output root; fragments are rendered HTML
# ids.
# The hpo.html anchors include every id of the page in these releases and
# the ids it had on the development branches before 2.0.0; hpo_examples.html
# has the ids of 1.3.0-beta.1, and optimizer.html, anneal.html,
# anneal_pt.html and asa.html those of 1.5.0. cli/cli_auto_gen.html, the
# command reference that cli/cli.html includes, was also built as a page of
# its own; each of its command sections leads to that command's label on
# cli/cli.html.
# Numeric ids from duplicate section labels do not identify stable topics.
