[ALLOWED_KEYS.EMBF0]
INHERIT = ["TYPES.STRING"]
# Explicit default "ZERO": DM_REAM reads the key in its constructor, which
# materialises the default into the model Context. Every
# DM_REAM potential tadah writes therefore carries an explicit EMBF0 line, and
# binaries whose blueprint predates the key refuse such files ("Invalid key:
# EMBF0") instead of silently evaluating the raw embedding. Only DM_REAM reads
# the key through Context::get; every other reader uses stored_value(), and the
# potential writers strip it from potentials without a DM_REAM block.
# allowed_values: any other value is an error at its line when a
# configuration or potential file is read (matched without regard to case).
default_value = ["ZERO"]
allowed_values = ["ZERO", "FREE"]
value_format = ["ZERO|FREE"]
description  = "DM_REAM embedding reference: ZERO (default), the zero-referenced basis g~_m(rho) = g_m(rho) - g_m(0) with F(0) = 0 exactly, or FREE, the raw basis g_m with F(0) = sum_m w_m g_m(0). A property of the potential, written into every DM_REAM pot.tadah and read as ZERO when absent; not an OPTIM target."
long_description = """
EMBF0 selects the reference of the DM_REAM embedding function
F(rho) = sum_m w_m g_m(rho).

ZERO (default): every embedding basis function is replaced by
g~_m(rho) = g_m(rho) - g_m(0), with g_m(0) computed from the CEMBFUNC,
SEMBFUNC and KDEGEMB values actually evaluated (for every evaluation of
tadah hpo as well).
F(0) = 0 exactly, so with a linear model and BIAS false an isolated atom has
energy 0 exactly, on every path (tadah predict/train/hpo and the LAMMPS pair
style, EAMFAST, generic and dimer kernels).

FREE: the raw basis g_m; F(0) = sum_m w_m g_m(0) is
whatever the coefficients make it.

Differences between the two modes:
- Linear models (M_BLR with BF_Linear, M_KRR with Kern_Linear): the embedding
  derivatives g'_m are identical, so forces and stresses are identical; every
  atomic energy moves by the same constant, -F(0) of the stored WEIGHTS
  (with or without NORM: a linear model stores raw-descriptor coefficients).
- Non-linear models (BF_Polynomial2, non-linear KRR kernels): the descriptor
  values change, so energies AND forces change.
- DM_mJoin: EMBF0 is one global setting for every DM_REAM block; only the
  DM_REAM block vanishes at rho = 0, other many-body blocks keep their value.

Values: ZERO or FREE, in any case; any other value is an error at its line
when the configuration or potential is read. The key has no effect without a
DM_REAM block: a fit (tadah train, tadah hpo) refuses a configuration without
one that has the key, naming its line. tadah refit reads the key from a
configuration without DESCRIPTOR blocks. --retarget and a configuration with
DESCRIPTOR blocks refuse it. --edit refuses a value that differs from the
one the potential declares. A potential without a DM_REAM block
that has the key still loads, the key is never written into such a potential,
and it is reported once per process on standard error, "WARNING: Key EMBF0 is
ignored: it applies only to a DM_REAM many-body block, and the potential has
none (...)", like a deprecated key (VERBOSE does not hide
it). pair_style tadah writes it as a LAMMPS warning on rank 0 instead, in
log.lammps and on the screen, each time pair_coeff loads such a potential
("WARNING: pair tadah: potential '<file>': Key EMBF0 is ignored: ..."). An
EMBF0 line of the configuration of tadah refit --edit (-c) for such a
potential is reported on standard error the same way.

Migration: a potential written by tadah 1.5.0 or earlier reproduces its
energies with `EMBF0 FREE` added. Training a DM_REAM model on absolute reference
energies (e.g. DFT totals) under ZERO needs a per-atom reference energy from
ESHIFT, ESHIFT_ATOM or ESHIFT_DBATOM (compatible with EAMFAST), or BIAS true
(disables EAMFAST; its intercept columns, one per ATOM species, precede the
descriptor coefficients, so FIXINDEX/FIXWEIGHT indices shift). External setfl converters must tabulate F(rho) - F(0) unless EMBF0 is FREE.
"""
examples     = ["ZERO", "FREE"]
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.RHOFORM]
INHERIT = ["TYPES.STRING"]
# Deliberately NO default_value: the key is mandatory for every DM_REAM
# potential and configuration, and nothing may supply it implicitly. Readers
# use only Context::has_stored()/stored_value() (a Context::get on the absent
# key would log a spurious ERROR before throwing); an absent key is a load
# error with the migration text below. Only DM_REAM evaluates the key; the
# potential writers canonicalise it to upper case and strip it from
# potentials without a DM_REAM block.
# allowed_values: any other value is an error at its line when a
# configuration or potential file is read (matched without regard to case),
# as for EMBF0; DM_REAM refuses it too in a Context built in code.
allowed_values = ["SIGNED", "NONNEG", "MONOTONE"]
value_format = ["SIGNED|NONNEG|MONOTONE"]
description  = "DM_REAM density form, mandatory for every DM_REAM potential and configuration: SIGNED (amplitudes of any sign), NONNEG (every AMPGRIDMB entry >= 0, so rho >= 0 by construction) or MONOTONE (integrated-bump step functions with AMPGRIDMB >= 0, so rho >= 0 and non-increasing by construction). A property of the potential, written into every DM_REAM pot.tadah; not an OPTIM target."
long_description = """
RHOFORM selects how the DM_REAM pair density rho(r) is built from the
density grids CGRIDMB, SGRIDMB and AMPGRIDMB (W = the WATOM pair weight,
f_c = the many-body cutoff RCTYPEMB, psi_n = the density basis function of
the TYPEMB basis code):

SIGNED: rho(r) = W f_c(r) sum_n a_n psi_n(r) with amplitudes of any sign.
This form carries no guarantee: rho can go negative, for instance in the
tail.

NONNEG: the SIGNED expression with every a_n >= 0 and every density pair
weight W > 0, and the cutoff clamped at max(f_c, 0); the Gaussian basis also
needs every SGRIDMB entry > 0. rho >= 0 exactly. With
the knot family (basis code 2), knots <= RCUTMB and a non-increasing cutoff
(any cutoff except Cut_SinInv) rho is also non-increasing and convex.

MONOTONE: rho(r) = W max(f_c(r), 0) sum_n a_n S_n(r), with S_n the
integrated bump: the integral of psi_n from r outwards divided by its
integral over the whole support, so S_n = 1 inside the bump's inner support
edge, 1/2 at its centre and 0 beyond its outer edge. Every a_n >= 0, every
SGRIDMB entry > 0 and W > 0.
rho >= 0 exactly and rho is non-increasing (to rounding), so the lattice
density rhobar(a) is non-increasing on every lattice. Bump families only
(Blip, Blip5, Gaussian); the knot family is refused (NONNEG serves instead:
a non-negative knot density is already non-increasing with a non-increasing
cutoff). The cutoff must be one of Cut_Dummy, Cut_Cos, Cut_CosS, Cut_Tanh,
Cut_PT, Cut_Poly and Cut_PolyS.

The key is global: every DM_REAM block, including the DM_mJoin children, uses
the same form. Values: SIGNED, NONNEG or MONOTONE, in any case (written in
upper case); any other value is an error at its line when the configuration or
potential is read, also without a DM_REAM block. A valid value has no effect
without a DM_REAM block. A fit (tadah train, tadah hpo) refuses a
configuration without one that has the key, naming its line. tadah refit
reads the key from a configuration without DESCRIPTOR blocks; --retarget
refuses it and takes --rhoform instead, and --edit accepts only the
potential's own value. A potential without a DM_REAM block that has the key
still loads, and the key is never written into such a potential. The key is
then reported once per process on standard error ("WARNING: Key RHOFORM is
ignored: ..."), like a deprecated key and as EMBF0. pair_style tadah reports
it as a LAMMPS warning on rank 0 each time pair_coeff loads such a potential.

Migration: a DM_REAM potential or
configuration without RHOFORM is an error. A potential written before
tadah 1.6.0 gives its 1.5.0 energies with both `RHOFORM SIGNED` and `EMBF0 FREE`
added: `RHOFORM SIGNED` keeps the density, and an absent EMBF0 reads as ZERO,
which changes the energies (see EMBF0). Older binaries
refuse a potential carrying RHOFORM (Invalid key).
"""
examples     = ["SIGNED", "NONNEG", "MONOTONE"]
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.MPARAMS]
INHERIT = ["TYPES.DOUBLES"]
description  = "Numeric parameters of the kernel of an M_KRR model (Kern_RBF, Kern_Polynomial, Kern_Sigmoid), in the order the kernel reads them."
long_description = """
The parameters of the kernel of an M_KRR model, in this order:

- Kern_RBF: sigma, the width of K(b, x) = exp(-r^2 / (2 sigma^2)), r the
  distance between b and x (gamma = 1/sigma^2); a sigma of 0, a sigma that
  is not finite and a sigma so small that 1/sigma^2 is not finite are
  refused, and a
  negative sigma gives the kernel of its magnitude;
- Kern_Polynomial: d gamma c, K(b, x) = (gamma b.x + c)^d; d is an
  integer: 2, 2.0 or 2e0 is read as 2, and a value that is not an integer
  (2.7) is refused;
- Kern_Sigmoid: gamma c, K(b, x) = tanh(gamma b.x + c).

Kern_Linear, Kern_Quadratic, Kern_LQ and the basis functions of M_BLR
(BF_Linear, BF_Polynomial2) take none.

`tadah hpo` builds the model of every evaluation from its candidate, so
`OPTIM MPARAMS` searches the kernel's parameters. It refuses at startup
`OPTIM MPARAMS (i)` on a function that reads fewer than i values (every
function that takes none), on the degree d of Kern_Polynomial (an integer)
and on the sigma of Kern_RBF with a box that is not positive.
"""
examples     = ["0.5", "3 0.5 1.0"]

[ALLOWED_KEYS.MODEL]
names = true
value_type   = ["STRING STRING", "STRING STRING STRING",  "STRING STRING UINT"] 
value_format = ["MODEL FUNCTION", "MODEL FUNCTION IMPLEMENTATION", "MODEL FUNCTION IMPLEMENTATION"]
value_N      = [-3]
description  = "Defines the training model and function."
long_description = """
MODEL names the model, M_KRR or M_BLR, and FUNCTION its kernel (M_KRR) or
basis function (M_BLR). Various combinations (KRR with different kernels,
BLR with various basis functions) are possible.

M_KRR takes the kernels Kern_Linear, Kern_RBF, Kern_Polynomial,
Kern_Quadratic, Kern_LQ and Kern_Sigmoid (their parameters: MPARAMS), and
M_BLR the basis functions BF_Linear and BF_Polynomial2. The third token of
M_KRR is its implementation, 1 by default; M_KRR refuses another
implementation.

Implementation 1 fits energies, forces and stresses by least squares over
the design matrix. Implementation 2 fits energies only. It solves
(K + LAMBDA s^2 I) w = t for every coefficient at once. Here K is the kernel
matrix of the basis vectors, t the energy per atom of each drawn structure
(0 for the intercept vectors) and s the energy error scale ESIGMA in eV.
Implementation 2 therefore refuses FIXINDEX and FIXWEIGHT.

The LAMBDA of implementation 2 weighs against the residuals of the energies
per atom over ESIGMA, as in implementation 1. No force, stress or priority
of the data enters its solve: it refuses FORCE true, STRESS true, ENERGY
false, ENORM SQRT, an FSIGMA or SSIGMA other than its default (compared by
value), a WDBFILE value other than 1 and a structure whose eweight is not 1,
each naming implementation 1, which fits them. Its solve, a Cholesky
factorisation, reads no OALGO: an OALGO other than the default (OALGO 1,
with no second value or 1e-8) is refused the same way.

Every kernel but Kern_Linear works on SBASIS basis vectors (SBASIS says how
they are drawn). Kern_Linear uses them only with implementation 2, whose
solve needs them. Its coefficients are then the descriptor coefficients of
the basis vectors (sum_j w_j b_j, the same model, as the kernel is linear):
DSIZE of them and no BASIS, as with implementation 1.
"""
examples     = [
    "M_BLR BF_Linear",
    "M_BLR BF_Polynomial2",
    "M_KRR Kern_Linear",
    "M_KRR Kern_RBF 1"
]

[ALLOWED_KEYS.AUDIT]
INHERIT = ["TYPES.STRING"]
description = "Pre-flight audit mode. 'off' (default) skips the audit. 'warn' emits diagnostics but proceeds. 'error' makes any FAIL-level finding fatal. The audit's data scan is sampled by default (AUDIT_SAMPLE)."
long_description = """
Pre-flight audit mode of tadah train and tadah hpo: 'off' (default) skips
the audit, 'warn' emits diagnostics but proceeds, 'error' makes any
FAIL-level finding fatal (exit status 1). The audit's data scan is sampled
by default (AUDIT_SAMPLE, which says when every structure is scanned). It
checks the parameters of each descriptor against the neighbour distances of
the element pairs it sums over, those its TYPE2B or TYPEMB line names or
the PAIRS of its DESCRIPTOR block: the (Ta, W) distances alone for TYPE2B
D2_Blip 4 4 Ta W. Each pair is judged on its own, as a pair that the
cutoff, or every channel of a density, does not reach adds nothing to the
descriptor. A pair of the line with * stands for each element pair it
matches, of the elements of the data and those the line names (* * for
every pair): on Ta-W data, Ta * stands for the (Ta, Ta) and (Ta, W) pairs,
and is judged as the line Ta Ta Ta W is. A descriptor fails when its cutoff (RCUT2B, RCUTMB, or
the cutoff RADIUS of a DESCRIPTOR block) holds no neighbour distance of one
of its pairs: the cutoff lies below that pair's smallest distance, or the
data have no pair of atoms of that kind within it. A TYPE2B line with the
pairs Ta Ta W W (for example D2_Blip 4 4 Ta Ta W W) and a cutoff that holds
the (W, W) distances and no (Ta, Ta) distance fails, as its (Ta, Ta) pair
adds 0 for every Ta atom.
The radial channels of a many-body density are judged together within its
cutoff: a channel fails when it reaches no neighbour distance of any pair
of the line, and a pair fails when no channel reaches its distances (a
Gaussian reaches none when it is below 1e-6 at all of them, a blip when its
support holds none), whatever the centres. A channel that misses one pair
while another channel reaches it is no finding. A finding names the pairs
("below the smallest (Ta, W) neighbour distance of the dataset"). D2_Knot5,
or a knot DM_REAM density, is judged at its largest knot, the cutoff tadah
train and tadah hpo give it (on a joined line, its own RCUT2B or RCUTMB
entry). Each descriptor of a D2_mJoin or DM_mJoin line, and each descriptor
that TYPEMB places among DESCRIPTOR blocks (TYPEMB DM_EAD ... Ta Ta and
TYPEMB @ta), is judged by the element pairs of its own line and its own
channels and cutoff, and a channel is named by its entry of the whole key.
Under tadah hpo it also warns about a critical parameter that the seed
fixes and the search space leaves out, for a descriptor that has a key in
the search space; the warning names the descriptor's entries of the key
(RCUTMB(2)). A key counts as searched for a descriptor when the search
space holds one of that descriptor's own entries of it: OPTIM RCUT2B (1)
searches the cutoff of the first descriptor of a D2_mJoin line, not that of
the second. Each descriptor of a joined line is judged by its own values
there too: a descriptor whose own centres are all at the origin gets no
warning about its centres. The cutoff of D2_Knot5 or of a knot DM_REAM
density is not flagged: tadah hpo derives it from the largest knot. Nor is
that of D2_Blip, D2_Blip5 or a blip DM_REAM density under Cut_Dummy, whose
bumps tadah hpo keeps within it. Both rules apply on a line of one
descriptor and on a D2_mJoin or DM_mJoin line. AUDIT is a setting of the
run, not of the potential. A written potential has no AUDIT line; its
training record lists the value the run used. An AUDIT line in a potential
file is not read by a retrain or tadah hpo -c of it.
"""
default_value = ["off"]
examples = ["off", "warn", "error"]

[ALLOWED_KEYS.AUDIT_SAMPLE]
INHERIT = ["TYPES.INT"]
description = "Number of training structures sampled (deterministic random) for the pre-flight audit's dataset statistics. 0 means every structure of the training data. Has no effect when AUDIT is 'off'."
long_description = """
Number of training structures sampled (deterministic random) for the
pre-flight audit's dataset statistics; 0 means every structure of the
