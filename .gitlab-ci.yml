variables:
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_COMMIT_SHA/$CI_PROJECT_NAME
  
stages:
  - build.debug
  - run.unit.tests
  - build.release
  - run.functional.tests
  - build.examples
  - run.examples
  - trigger

before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build-debug:
  stage: build.debug
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}
    - make install

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e ${DEBUG_DIR} -e CORE -e MODELS -e MLIP -e LIBS -e HPO  
  stage: build.debug
  needs: [build-debug]
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

run-unit-tests-1:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e ${DEBUG_DIR} -e CORE -e MODELS -e MLIP -e LIBS -e HPO  
  stage: run.unit.tests
  needs: [build-tests]
  script:
    - cd ${DEBUG_DIR}
    - make test
    - cd ..; gcovr -e '.*tests.*|.*lib.*|.*docs.*|.*example.*|.*scripts.*|.*LIBS.*|build' -r .
  coverage: /^TOTAL.*\s+(\d+\%)$/

build-release-shared:
  stage: build.release
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}
  artifacts:
    paths:
      - $RELEASE_DIR/*


build-release-static:
  stage: build.release
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}
  artifacts:
    paths:
      - $RELEASE_DIR/*
      - CORE/$RELEASE_DIR/*
      - MODELS/$RELEASE_DIR/*
      - MLIP/$RELEASE_DIR/*
      - HPO/$RELEASE_DIR/*
      - LIBS/$RELEASE_DIR/*

run-func-tests-shared:
  stage: run.functional.tests
  needs: [build-release-shared]
  script:
    - cd $RELEASE_DIR
    - make install
    - ls -l ~/.local/bin/ta-dah
    - ls -l ~/.local/lib/libtadah*
    - echo $PATH
    - which ta-dah
    - ta-dah
    - ta-dah -h
    - ldd ~/.local/bin/ta-dah

run-func-tests-static:
  stage: run.functional.tests
  needs: [build-release-static]
  script:
    - cd $RELEASE_DIR
    - make install
    - ls -l ~/.local/bin/ta-dah
    - ls -l ~/.local/lib/libtadah*
    - echo $PATH
    - which ta-dah
    - ta-dah
    - ta-dah -h
    - ldd ~/.local/bin/ta-dah

build-example-1-static:
  stage: build.examples
  needs: [build-release-static]
  script:
    - cd $RELEASE_DIR
    - make install
    - cd ${RELEASE_DIR}/examples/ex_1
    - g++ -O3 ex1.cpp -ltadah -llapack -fopenmp
  artifacts:
    paths:
      - $RELEASE_DIR/examples/ex_1/a.out

build-example-2-static:
  stage: build.examples
  needs: [build-release-static]
  script:
    - cd $RELEASE_DIR
    - make install
    - cd ${RELEASE_DIR}/examples/ex_2
    - g++ -O3 ex2.cpp -ltadah -llapack -fopenmp
  artifacts:
    paths:
      - $RELEASE_DIR/examples/ex_2/a.out

build-example-1-shared:
  stage: build.examples
  needs: [build-release-shared]
  script:
    - cd $RELEASE_DIR
    - make install
    - cd ${RELEASE_DIR}/examples/ex_1
    - g++ -O3 ex1.cpp -ltadah -llapack -fopenmp
  artifacts:
    paths:
      - $RELEASE_DIR/examples/ex_1/a.out

build-example-2-shared:
  stage: build.examples
  needs: [build-release-shared]
  script:
    - cd $RELEASE_DIR
    - make install
    - cd ${RELEASE_DIR}/examples/ex_2
