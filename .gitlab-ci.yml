variables:
     GIT_SUBMODULE_STRATEGY: recursive
     GIT_SUBMODULE_UPDATE_FLAGS: --remote

stages:          # List of stages for jobs and their order of execution
  - build
  - test

before_script:
 #- sudo apt-get update --yes
 #- sudo apt-get install --yes g++
 #- sudo apt-get install --yes liblapack-dev
 #- sudo apt-get install --yes libblas-dev
 - g++ --version
 - export PATH=$PATH:~/.local/bin
 - export CPATH=$CPATH:~/.local/include
 - export LIBRARY_PATH=$LIBRARY_PATH:~/.local/lib
 - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/.local/lib:/usr/local/lib
 - export OMP_NUM_THREADS=1


build-job:
  stage: build
  script:
    - pwd
    - ls -l
    - mkdir -p build
    - cd build
    - cmake .. -DTADAH_ENABLE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=~/.local -DTADAH_BUILD_TESTS=OFF
    - make -j 1
    - make install
  artifacts:
    paths:
      - "build"

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e build/
  stage: build
  dependencies:
    - build-job
  script:
    - pwd
    - ls -l
    - cd build
    - cmake .. -DTADAH_ENABLE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=~/.local -DTADAH_BUILD_TESTS=ON
    - make -j 1

test-job1:
  stage: test
  dependencies:
    - build-tests
  script:
    - ta-dah --version
    - ta-dah --help

test-job2:
  stage: test
  dependencies:
    - build-tests
  script:
    - make test