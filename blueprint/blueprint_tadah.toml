[TASKS.analysis.dataset_stats]
description      = "Computes dataset statistics (per-pair r_ij, neighbour counts, energy/force scales) and writes them to a report file."
long_description = """
Computes per-element-pair distance percentiles + KDE peaks, neighbour-count
percentiles per element, energy-per-atom percentiles, force-norm percentiles,
and a material-class label over the supplied DBFILEs / STRUCTUREs. Writes
the result to the file given with --outfile. The file is a report only:
tadah analysis suggest_bounds, tadah analysis check_bounds and the
pre-flight audit compute the statistics they need themselves.

The cutoff is the largest cutoff of the configuration given with -c
(RCUT2B, RCUTMB or the cutoff RADIUS of a DESCRIPTOR block). The data are
the DBFILE and STRUCTURE lines of the configuration. With --dbfile or
--structure, the data are the datasets or structures the option names, and
these lines are not read. --dbfile and --structure need -c and exclude
each other.

Every pair strictly inside the cutoff counts, a pair at distance 0 (two
atoms at one position) included, so r_min is 0 for such a dataset.
It also prints how many structures have a non-symmetric cell and lists
them by index and label: only in these can a transposed cell be told apart
(the data-migration note of Dataset Format).
With --close-contact <A> it lists every pair of atoms closer than A
Angstrom by structure, atoms and distance.
"""
examples         = ["tadah analysis dataset_stats -c train.tadah --outfile stats.tadah",
                    "tadah analysis dataset_stats -c train.tadah -d test.tadah -o stats.tadah",
                    "tadah analysis dataset_stats -c train.tadah -s crystal.cif -o stats.tadah",
                    "tadah analysis dataset_stats -c train.tadah --outfile stats.tadah --close-contact 0.5"]
