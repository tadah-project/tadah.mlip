[ALLOWED_KEYS.config]
value_type     = ["STRING"]
value_format   = ["<file>"]
value_N        = [1]
description    = "Path to a configuration file."
long_description = """
With -c (--config), CONFIG names the configuration file of the command. As
a line of a configuration file, CONFIG includes another file. The
configuration is the concatenation of its lines: the lines of the included
file are read in place of the CONFIG line, in their order. A file can have
several CONFIG lines, and an included file can include another the same
way. A file that includes itself, directly or through the files it
includes, is refused.

A key of one value other than CONFIG, such as BIAS or ESIGMA, is set once
in a configuration file and the files it includes. So is a key the command
takes one value of, such as the OUTFILE of tadah train. A second line of
the key, in the same file or in another, above or below the CONFIG line, is
refused naming both lines and their files. A file included twice, by two
CONFIG lines or through two included files, gives its lines twice, so its
keys of one value are refused. A setting that differs between the files
that include a shared file goes in each of them, not in the shared file.

The lines of a key of several values add up in line order: DBFILE lists the
datasets of all its lines. A line past the number of values the key takes
is refused. A key of the descriptors of a potential (a file with WEIGHTS)
is set by the potential's own line; a second line of it in the potential
file, or a TYPE2B or TYPEMB line other than those tadah writes, is refused
(the Training page of the documentation, Retraining from a potential). A
line the run does not read, such as the EFILTER line of an included
potential (the same page), sets nothing. An option of the command line
takes precedence over the lines of its key. An option that -c of the
command needs (Needs in the help of the command) would replace a line of
its key on every run, so a configuration file of that command refuses
such a line: OUTFILE of tadah analysis dataset_stats and tadah analysis
suggest_bounds, RANGE and TYPE of tadah analysis bfunc, HPOTARGET of
tadah hpo.

A relative path is relative to the working directory, the directory the
command runs in, not to the directory of the file that holds the line. This
holds for the path of a CONFIG line and for every path in an included file,
such as a DBFILE line.
"""
examples       = ["config.tadah", "../config.tadah", "/path/to/config.tadah"]
cli_long_flag  = "--config"
cli_short_flag = "-c"
cli_required   = false

[ALLOWED_KEYS.verbose]
INHERIT = ["TYPES.UINT"]
description  = "Verbosity level. 0-2: ERROR, WARNING, INFO."
long_description = """
Verbosity level. 0: ERROR, 1: WARNING, 2: INFO. The verbosity level controls 
the amount of information printed during execution. Higher levels provide 
more detailed output.

A setting of the run, not of the model: no potential has a VERBOSE line
(tadah train, tadah hpo and tadah refit write none). The training record of
the potential, a comment block above its key lines that is never read as
keys, lists the VERBOSE its run was given. A VERBOSE line in a loaded
potential is not read, like
its other run settings (VALIDATION, HPOTARGET, CHECK, NUMERIC, OUTFILE,
AUDIT, AUDIT_SAMPLE, HEALTH_LOG): no program that loads the potential (tadah
predict, pair_style tadah, tadah refit --edit, a retrain, tadah hpo -c or
tadah analysis check_bounds -c) takes its verbosity or its model's from it,
and a retrain, tadah hpo -c or tadah analysis check_bounds -c names the line
in a WARNING when it is not 1 and the run gives no VERBOSE of its own.
"""
examples     = ["2"]
default_value = ["1"]
cli_long_flag  = "--verbose"
cli_short_flag = "-v"
cli_required   = false

[ALLOWED_KEYS.bias]
INHERIT = ["TYPES.BOOL"]
description  = "Per-species intercept. When true, every atom's descriptor starts with N=size(ATOM) one-hot intercept columns, in ATOM order (1 for the atom's species, 0 for the others), on every path (tadah train, predict and hpo, and pair_style tadah): the regression learns one constant energy per species (for BF_Linear and Kern_Linear weights 1 to N, the descriptor weights from N+1; for BF_Polynomial2 the products (k,k); for a dot-product kernel the weights of the intercept basis vectors, its weights 1 to N) and LAMMPS adds it back per atom. Requires ATOM; an atom of an element ATOM does not list is refused. Only energies determine the constants: the compositions of the training structures whose energies the fit observes (ENERGY true and the structure's eweight times the WDBFILE value of its dataset above 0) must determine them (not every structure of one composition, e.g. a fixed stoichiometry), or training is refused (tadah train, tadah hpo at startup; not M_KRR implementation 2, whose solve fits the basis vectors' targets), naming the model's intercept weights; FIXINDEX/FIXWEIGHT can pin some of them instead (the ridge still penalises every other weight). Required when NORM=true with MODEL=BF_Linear or Kern_Linear. A potential trained with BIAS true and two or more species by tadah 1.5.x or earlier has one intercept column shared by all species; it is refused when it predicts (tadah predict, pair_style tadah): it needs retraining."

[ALLOWED_KEYS.eamfast]
INHERIT = ["TYPES.BOOL"]
# Explicit default_value true overrides the inherited TYPES.BOOL default (false);
# the Context injects it on first query, so pair_tadah reads true unless the
# user sets EAMFAST false. Same mechanism as refit_constrain_f0 above.
default_value = ["true"]
description  = "Table-collapse fast path in the LAMMPS pair style, pair_style tadah."
long_description = """
Table-collapse fast path in the LAMMPS pair style, pair_style tadah.

For a single-species linear model the potential collapses exactly to scalar
radial functions: a radial two-body block alone (INITMB false, any radial D2
descriptor) collapses to a pair function phi(r). A two-body block plus one
EAM-form many-body block, a DM_Embed component (what tadah refit writes,
e.g. D2_Knot5 + DM_Embed) or DM_REAM, the many-body descriptors for which
this EAM collapse is implemented, additionally collapses to density and
embedding functions. The pair style then evaluates cubic-Hermite tables
sampled from the descriptors themselves (plus the analytic embedding and
scalar ghost communication in the EAM case; the pure two-body case needs no
ghost communication at all), which makes force calls faster. The gain grows
with the cost of the descriptors (MD of 250 atoms: 1.6x for a D2_LJ
potential (RCUT2B 6.5, Cut_Dummy), 3.4x for D2_LJ + DM_REAM, 4.5x for a
21-knot D2_Knot5 pair term).

Each table is certified when the potential is loaded: scanning down from the
cutoff, the pair style bounds the error of every table segment from 31 check
points and finds the smallest distance r_lo above which every segment meets
a relative tolerance of 1e-9 for the value and the derivative (energy and
force, relative to the function's own scale above that distance, and at
least its scale over the outer half of the cutoff). Below r_lo it evaluates
the analytic function, at the cost of the generic kernel. The fast path
therefore agrees with the generic kernel to 1e-9 relative accuracy inside
the certified range and exactly below it. The bound assumes the function is
smooth on the scale of 1/32 of the table spacing apart from isolated knots
and cutoff junctions. The certified range is one interval ending at the
cutoff, so a single segment that misses the tolerance, for example at a knot
of a C2 basis such as Blip or at the inner radius of a switching cutoff such
as Cut_PolyS, sets r_lo there even where the table is accurate further in.

The LAMMPS log states each certified range, the tolerance, the error bounds
and where the analytic evaluation takes over, e.g. for a D2_LJ potential
(RCUT2B 6.5, Cut_Dummy): Tadah! pair-collapse fast path ON (2b-only,
nr=8192): table certified for r in [2.80125, 6.5] (rel tol 1e-9: energy
3e-13, force 1e-9); analytic below r=2.80125. Distances are in the
potential's units. A table that misses the tolerance already in its top
segment, immediately below the cutoff, has no certified range: the log gives
the reason and the generic kernel is used.

EAMFAST false serves a bitwise comparison against the generic kernel, or
drivers that capture adjoint state on EAM-form models (pure two-body adjoint
capture works under the fast path via the generic kernel). Silently ignored,
generic kernel used, for models that do not collapse: nonlinear or
normalised models, per-species bias, multi-species, dimers, or a many-body
descriptor other than one DM_Embed component or DM_REAM (DM_mBlipEnv, for
example).
"""
examples     = ["true", "false"]
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

