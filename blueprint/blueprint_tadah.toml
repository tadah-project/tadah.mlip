the fit and its coefficients are unaffected."""
by_deletion = true

[ALLOWED_KEYS.dbfile]
INHERIT = ["TYPES.STRINGS"]
value_N      = [2147483647]
description  = "Path(s) to the dataset file(s) in the Tadah! format."
long_description = """
Absolute or relative path to the dataset file(s). The relative path 
is interpreted relative to the current working directory. Multiple dataset 
paths can be provided either as space-separated tokens or by repeating 
this key.

Each entry is a dataset. A training configuration (tadah train, tadah hpo)
that lists one file twice (the same path, two spellings of it, or a link to
it) is refused, naming both entries: its structures would be fitted twice.
WDBFILE gives a dataset a priority in the fit. The validation configuration
of tadah hpo (--validation, VALIDATION) whose DBFILE lines list one file
twice is refused likewise.

A potential written by tadah train, tadah hpo or tadah refit has no DBFILE
line, whichever the model. Its training record, a comment block above its
key lines that is never read as keys, lists the datasets its coefficients
were fitted to, when there were any. A refit has none, and a retrain records
its own. A potential without a training record lists no datasets.
A potential is retrained from a copy of it with a DBFILE line added
(`tadah train -c pot.tadah`). tadah train refuses a configuration without
DBFILE, saying so; tadah hpo trains without one only when FIXINDEX/FIXWEIGHT
fix every coefficient. An M_BLR potential that has a DBFILE line, the dataset
it was trained on (tadah predict and pair_style tadah do not
read it), has that line removed from the copy before the DBFILE line of
the retrain is added.
"""
examples     = ["/path/to/dbfile", "/path/to/dbfile1 /path/to/dbfile2"]
cli_long_flag  = "--dbfile"
cli_short_flag = "-d"
cli_required     = false

