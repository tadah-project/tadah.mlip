[ALLOWED_KEYS.refit_mode]
command_only = true
INHERIT = ["TYPES.STRING"]
description  = "`tadah refit` fitting mode, in any letter case (another value is an error): 'compact' (the default) or 'dense'."
long_description = """
`tadah refit` fitting mode, in any letter case (another value is an error):
'compact' (the default) or 'dense'.

'compact' optimises the blip centres and widths through a ladder and an
analytic-gradient Ceres polish (about 30-120 parameters, the search space
that suits `tadah hpo`). It needs the compact fitter, which a tadah built
with TADAH_ENABLE_NFP and TADAH_ENABLE_CERES has: a tadah built without them
refuses compact mode, written or the default. 'dense' fits region-uniform
grids with automatic basis escalation (about 300-450 parameters) and is the
fastest fit.

A key that only the other mode reads is an error naming it and the mode that
reads it. REFIT_LEVEL, N2B, NRHO_BASIS, NF_BASIS, REFIT_MAX_ESCALATIONS,
REFIT_PLACEMENT and REFIT_CONSTRAIN_F0 are dense-only. The REFIT_COMPACT_*
keys, REFIT_OBJECTIVE curve, REFIT_CURVE_WEIGHTING, REFIT_CURVE_RELAX,
REFIT_CURVE_DERIV_WEIGHT and the INIT, EXPLORE, REFINE and FUSE blocks are
compact-only. REFIT_COMPACT_MERGE, REFIT_COMPACT_OPT_EVERY and
REFIT_COMPACT_INSERT_TOPK, which the knot families alone read, are refused
