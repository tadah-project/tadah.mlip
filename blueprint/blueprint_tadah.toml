description  = "`tadah refit --retarget`: the DM_REAM density form (RHOFORM) of the potential the target file searches around. Under NONNEG or MONOTONE the rewritten AMPGRIDMB bounds are non-negative (lo = max(0, v - d), the rule `tadah refit` also applies when it writes a target file)."
