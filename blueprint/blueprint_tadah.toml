`tadah refit --retarget`: the DM_REAM density form (RHOFORM) of the potential
the target file searches around. Under NONNEG or MONOTONE the rewritten
AMPGRIDMB bounds are non-negative (lo = max(0, v - d), the rule `tadah refit`
also applies when it writes a target file).

Under NONNEG or MONOTONE the file also gets the parsed header line
'# RHOFORM <form>: AMPGRIDMB bounds are non-negative (lo = max(0, v - d))',
which a later --retarget run reads; SIGNED adds no header. A header that names
another form is an error. The option serves a target file whose header
declares no density form while its potential uses NONNEG or MONOTONE. RHOFORM
itself is not accepted with --retarget (a target file carries no potential).
A target whose many-body parameters are DM_Embed component paths only
(COMPONENT_PARAMETER lines and no AMPGRIDMB group: every target tadah refit
writes) refuses --rhoform: a component's form is its potential's FORM,
