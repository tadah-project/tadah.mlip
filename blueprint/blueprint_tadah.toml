[ALLOWED_KEYS.numeric]
INHERIT = ["TYPES.UINT"]
description  = "Numeric output precision."
long_description = """
Sets the precision of numbers in written output files.

Potential files (pot.tadah written by train, refit, refit --edit and hpo) and
dataset files (written by tadah data convert, merge, split, sample, dedup and
balance): NUMERIC is the number of SIGNIFICANT digits (printf %.{N}g) of every
non-integer number of the potential's key/value lines but those of the cutoff
and grid keys (below), and of every number of a dataset. The default 18 is
exact: every double reads back bit-identically (17 significant digits always
suffice). An explicit NUMERIC below 17 is honoured but warned about, because
the written file then differs from the values in memory. Integers in a
potential are always written exactly, and so are the numbers of the cutoff and
radial-grid keys RCUT2B, RCUTMB, CGRID2B, CGRIDMB, SGRID2B and SGRIDMB,
whatever NUMERIC is: a load checks them exactly (D2_EAM and DM_EAM compare
RCUT2B/RCUTMB with the cutoff of their setfl file, a knot channel's cutoff is
its largest knot, and the knot and bump-support checks relate the grids to the
cutoff), so the potential loads with the cutoffs and grids it was fitted with.
Below 17 they are written as the shortest text that reads back as the same
value (RCUT2B 5.58190742024 at NUMERIC 6).
NUMERIC itself is never a key line of a potential file (its training record,
a comment block never read as keys, lists the NUMERIC the run was given, as
written). A NUMERIC line in a potential file is not read: a retrain,
tadah hpo -c and tadah refit --edit of it write with their own NUMERIC (a
retrain and tadah hpo -c name the line in a WARNING, refit --edit moves it
into the edit's training record). The '#' comment lines of
a potential (the header tadah hpo writes, the training record) are
annotations not governed by NUMERIC; its machine-read lines (# HPO_BEST_LOSS,
# HOT) are always exact. The target files
of tadah refit (a refit, --edit and --retarget) are not governed by NUMERIC
either: their OPTIM bounds are printed %.8e (9 significant digits) whatever
NUMERIC is. tadah refit --retarget, which writes only a target file, refuses
NUMERIC.

The structure exports of tadah data write use significant digits too for
LAMMPS data files and VASP POSCAR (both read E-notation); the CASTEP cell
export keeps NUMERIC decimal places.

Values loaded into memory are never limited by NUMERIC, and calculations
always use full precision.

In predictions and in the tables of tadah analysis descriptor and tadah
properties pairwise, NUMERIC is the number of digits after the decimal point
in scientific notation. In the tables of tadah analysis bfunc and tadah
analysis cutoff, it is the number of decimal places in fixed notation.
"""
examples     = ["18"]
default_value = ["18"]
cli_long_flag  = "--numeric"
cli_short_flag = ""
cli_required   = false

