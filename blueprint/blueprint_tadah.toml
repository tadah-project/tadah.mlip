[TASKS.predict]
description = "Predicts properties with a trained model."
long_description = """
Predicts with an already trained model. Energy per atom is always calculated,
while forces and stresses are optional. By default, energies are written to
energy.pred, and if forces or stresses are calculated, they are written to
forces.pred and stress.pred, respectively. The data to predict are Tadah!
datasets (--dbfile), or structure files and online structures (--structure;
tadah explain predict.structure lists the supported types). The model is
the potential's, as it was fitted: tadah predict takes no configuration
file and changes no key of the model but LSCALE and ESHIFT (--lscale,
--eshift, --no-lscale, --no-eshift).
"""
examples         = ["tadah predict -p pot.tadah -s crystal1.cif crystal2.cif --force", "tadah predict -p pot.tadah -d db1.tadah --numeric 12", "tadah predict -p pot.tadah -d db.tadah --stress --outfile predicted_energy.dat predicted_stresses.dat"]
[TASKS.predict.keys]
INHERIT          = ["ALLOWED_KEYS.potential", "ALLOWED_KEYS.force", "ALLOWED_KEYS.stress", "ALLOWED_KEYS.error", "ALLOWED_KEYS.analytics", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.outfile", "ALLOWED_KEYS.lscale", "ALLOWED_KEYS.eshift", "ALLOWED_KEYS.efilter", "ALLOWED_KEYS.ffilter", "ALLOWED_KEYS.zero_com_force", "ALLOWED_KEYS.no_lscale", "ALLOWED_KEYS.no_eshift"]
[TASKS.predict.keys.error]
description = "Retired: an error computed from SIGMA beside every predicted value; uncertainty output is removed."
long_description = """
A command line that gives it is refused with the reason.
"""
examples = []
default_value = []
[TASKS.predict.keys.error.retired]
reason = """tadah predict --error wrote an error computed from SIGMA beside \
every predicted value (some of the errors negative). Uncertainty output is \
removed: the errors of Tadah! 1.0.0 to 1.5.0 were not standard deviations, \
and no calibrated estimate replaces them."""
replacement = "nothing"
conversion = """Deleting the option converts it: the predictions, and the \
fit of the potential, are unaffected."""
[TASKS.predict.keys.analytics]
cli_excludes = ["structure"]
long_description = """
Prints the energy metrics (MAE and RMSE in meV/atom, R^2) of every dataset,
and the force metrics (MAE and RMSE in eV/Å over the force components, R^2)
and the stress metrics (MAE and RMSE in GPa over the nine entries of each
stress tensor, R^2) when forces (-F) or stresses (-S) are predicted. A structure stored with energy priority 0 (eweight) is left out
of the energy metrics, one with force priority 0 (fweight) out of the force
metrics, and one with stress priority 0 (sweight) out of the stress
metrics: it has no energy, forces or stress tensor of its own (the values
stored for it are placeholders; tadah data convert stores zero forces and
stresses with that priority 0 for a file that gives none). A dataset in
which every structure has that priority 0 is not measured by those metrics:
nan in its column, left out of the mean, and a note names it. The R^2 of a
dataset whose reference values are all equal (the forces of ideal crystals,
all 0, or the energy per atom of one structure) has no value: nan in its
column, left out of the mean, and a note names it. A run in
which no dataset has an energy is not refused: its Energy lines are nan.
With -F (-S), a run in which no dataset has forces (a stress tensor) is
refused before predicting. So is a dataset that the filters given to tadah
predict (--efilter, --ffilter) leave without structures, with or without -F
and -S. The keys that prepared the training data of the potential
(EFILTER, FFILTER, ZERO_COM_FORCE, ESHIFT_ATOM, ESHIFT_DBATOM, WDBFILE; a
potential file may contain them as key lines) are not applied to the data
predicted.
"""
[TASKS.predict.keys.lscale]
# No default for predict: the potential's LSCALE applies to the data
# predicted, and --lscale replaces it. A default here would be the task's
# own LSCALE (1.0), which replaced the potential's in PredictEngine's merge.
default_value = []
description  = "(predict) Length rescale of the data predicted: the potential's LSCALE unless given."
long_description = """
The positions and cell of the data predicted are multiplied by this factor,
the forces divided by it and the stresses by its cube (LSCALE). Without
it the potential's LSCALE applies, the length scale of the model (a
potential without an LSCALE line: none); --lscale replaces it and
--no-lscale cancels it.
"""
[TASKS.predict.keys.outfile]
default_value = ["energy.pred", "forces.pred", "stress.pred"]
value_N = [-3]
description = "Output file name(s) for predicted values. The first file is for energies, followed by forces/stresses if requested. Every requested output needs a file name."
value_format = ["<energy_file> [<force_file>] [<stress_file>]"]
[TASKS.predict.groups.input]
description      = "Input sources for prediction: one or both of the following options:"
required_min = 1
required_max = 2
[TASKS.predict.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.dbfile", "ALLOWED_KEYS.structure"]
[TASKS.predict.groups.input.keys.dbfile]
cli_needs = ["potential"]
[TASKS.predict.groups.input.keys.structure]
cli_needs = ["potential"]

[TASKS.hpo]
description = "Optimises the model architecture and hyperparameters."
long_description = """
Refines a model's architecture and hyperparameters with Tadah!'s nested
fitting procedure. Each evaluation trains a potential and scores it with the
loss terms of the target file. Some loss terms measure the errors of the
potential on the datasets of the validation configuration. Others compare a
property computed with the potential, by a LAMMPS script (such as a surface
energy or a phase stability) or by tadah itself (PC_OBSERVABLE), with a
target value. The optimiser
named in the OPTIMIZER block searches the search space of the target file
and keeps the best potential. The target file also defines the loss-term
weight of each loss term.

The OPTIMIZER block of the target file names its optimiser with LIB and
ALGO: `tadah explain ALGO` lists the optimisers of this build by library
(and those it refuses), and `tadah explain <LIB>:<ALGO>`, or `tadah explain
<ALGO>`, prints the stops, PARAM keys and STEP use of one.

Ctrl-C (SIGINT) or SIGTERM stops the run once the evaluations in progress
finish, writing its results, and tadah says so on standard error at once. A
second Ctrl-C, or a second SIGTERM, ends it at once, as SIGKILL would:
best_pot.tadah keeps the last best it saved, and the history files can lack
the rows still queued. TADAH:ANNEAL_PT, TADAH:ANNEAL_PA and ASA:ASA with
Gener_Block_Max above 1 hold the result of an evaluation they run at once
with others until every lower-numbered evaluation run with it has ended, so
such an ending also loses the results held then.

Each new best potential gets the balance table of the fit of its evaluation
at the end of the training record of best_pot.tadah: one pass of the order
of n p^2 over the n rows and p coefficients of the fit, only for an
evaluation whose loss may make it the best, not for the others (the DUMP
and BDUMP archives have no table). The run prints the table of
best_pot.tadah once, when it ends, at VERBOSE 1 and above (the section The
balance table of the page What a Fit Minimises of the documentation).
"""
examples         = ["tadah hpo -c config.tadah --hpotarget config.hpo --validation valid.tadah", "tadah hpo --check -c config.tadah --hpotarget config.hpo --validation valid.tadah"]
[TASKS.hpo.keys]
INHERIT          = ["ALLOWED_KEYS.check", "ALLOWED_KEYS.force", "ALLOWED_KEYS.stress", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.lscale", "ALLOWED_KEYS.eshift", "ALLOWED_KEYS.eshift_atom", "ALLOWED_KEYS.eshift_dbatom", "ALLOWED_KEYS.efilter", "ALLOWED_KEYS.ffilter", "ALLOWED_KEYS.wdbfile", "ALLOWED_KEYS.wdbfile_auto", "ALLOWED_KEYS.eweight_temp", "ALLOWED_KEYS.zero_com_force"]
[TASKS.hpo.groups.input]
description      = "Input files of tadah hpo: --config and --hpotarget are required; --validation is optional."
required_min = 2
required_max = 3
[TASKS.hpo.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config", "ALLOWED_KEYS.validation","ALLOWED_KEYS.hpotarget"]
[TASKS.hpo.groups.input.keys.config]
# --validation is optional: PC_OBSERVABLE / PC_LAMMPS provide the loss
# when no validation set is given (validate_hpo_setup enforces that at
# least one loss source exists and that PC_ERMSE-style metrics have a
# validation file). --config and --hpotarget need each other, and
# --validation needs --config (so --hpotarget too): a command line without
# --config is refused naming it.
cli_needs = ["hpotarget"]
[TASKS.hpo.groups.input.keys.hpotarget]
cli_needs = ["config"]
[TASKS.hpo.groups.input.keys.validation]
cli_needs = ["config"]

