[ALLOWED_KEYS.CGRID2B]
value_type   = ["{DOUBLE}", "{STRING INT DOUBLE DOUBLE}"]
exact_in_potential = true
value_format = ["<double> [<double> ...]",  "(<generator> <n> <start> <stop>) [...]"]
value_N      = [-2147483647]
description  = "Controls the centre positions for radial basis functions (two-body)."
long_description = """
With D2_Blip, D2_Blip5 or D2_BP, the number of centres equals the number of
inverse widths (SGRID2B), and a different number is refused. D2_Knot5 reads
its knot positions from this key and refuses SGRID2B. The centres normally
lie at or below the cutoff distance (RCUT2B): every function is zero beyond
it.
The values of all lines form one list. With the meta descriptor D2_mJoin,
each joined descriptor takes as many centres as its TYPE2B line asks for,
in the order of the TYPE2B lines, and more or fewer values are refused.
One line per descriptor is a convention for reading.
A line holds values or generators (one or more), and lines of each kind
may follow one another:
LIN <n> <start> <stop> gives n evenly spaced values from start to stop,
and GEOM <n> <start> <stop> gives n values in a geometric progression
from start to stop (both above 0). The number n is a whole number from 1
to 1000000.
"""
examples     = [
    "LIN 10 0 6",
    "1.0 2.0",
    """1.0 2.0
1.5 2.5"""
]

