  parameter in the regenerated target file.
- --remove <centre>: deletes the basis function whose centre is nearest to
  <centre>; the two neighbouring coefficients are least-squares adjusted to
  track the original curve's value, first and second derivative over the
  affected region. Removal is lossy by design — the curves change slightly.

Outputs: an edited potential (-o; defaults to pot_edited.tadah so the input
is never silently overwritten) and a regenerated target file (--hpofileout;
defaults to refit_edited.hpotarget). For a knot-family channel alone on
its line RCUT2B/RCUTMB are recomputed from the basis (effective cutoff =
largest knot), so adding a knot beyond the current largest one widens the
effective cutoff. A D2_mJoin or DM_mJoin line keeps its stated cutoffs,
with which its coefficients were fitted; a fit (tadah train, tadah hpo)
derives each knot descriptor's own entry.
"""
examples     = ["pot.tadah"]
cli_long_flag  = "--edit"
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.retarget]
command_only = true
INHERIT = ["TYPES.STRING"]
value_format = ["<file>"]
description  = "Rewrites the OPTIM search bounds of an existing target file for `tadah refit` (with --pct, --set, -o or --in-place); refused with --edit or the EAM key."
long_description = """
Switches `tadah refit` to rewriting a target file: it reads an existing
target file (as written by `tadah refit` or a previous --retarget run) and
rewrites the bounds of every line `OPTIM <KEY> (<index>) <low> <high>` —
active AND commented, keeping the comment state and a comment after the
bounds — around the recovered parameter values. Keys are read in any case,
and each rewritten line keeps its key as written. An OPTIM line of another
form (an AUTO box, several indices, a shape tag, a continued line, a line
tadah hpo refuses) is kept as written, with a WARNING naming its line and
why. A commented line `# OPTIM <KEY> (...` is read as an active one and
named the same way; another comment that starts with OPTIM is not.

Options:
- --pct <N>: global +-percent half-width (default: OPTIM_PCT, else 5).
- --pct KEY=N: per-key override, e.g. --pct FIXWEIGHT=2 (repeatable;
  combines with the global value: --pct 10 CGRID2B=2). KEY needs an OPTIM line in
  the file (active or commented) that is rewritten; a KEY whose lines are kept
  as written is refused, naming them, and so is a --set on one of their
  indices.
- --set 'KEY(i)=lo,hi': absolute bounds for one parameter (repeatable,
  applied last): finite, lo < hi, and lo within the rule of the file's
  density form (AMPGRIDMB lo >= 0 under a RHOFORM NONNEG/MONOTONE header).
- --rhoform SIGNED|NONNEG|MONOTONE: the density form of the potential the
  file searches around (retarget_rhoform). Refused when the file's density
  amplitudes are DM_Embed component paths with no AMPGRIDMB group, or when
  its RHOFORM header line names another form.
- --rcut2b <r> / --rcutmb <r>: declares a bump channel's fixed cutoff in the
  same run — recentres the file's OPTIM RCUT reference on r and truncates the
  rewritten CGRID/SGRID boxes to the bump-support rule c + w/eta <= r
  (active OPTIM RCUT lines are commented out with a warning; the training
  configuration needs the same RCUT). --rcutmb is refused when the file's
  many-body parameters are DM_Embed component paths only (no CGRIDMB,
  SGRIDMB or RCUTMB group).

The numbers of --pct and --set follow the target-file number grammar
(decimal, finite, zero or a normal double: 5x, 0x10, inf, nan and 1e-320 are
errors).

The rest of the file is kept byte for byte, except the `Bounds are +-X%`
header and the `# KEY  (+-X%, ...)` group comments, which --pct rewrites,
the lines --rcut2b, --rcutmb and --rhoform change (above), and the
commented RCUT lines of a knot-family potential (below). The output
goes to -o (default: <input>_retargeted.hpotarget, which no other mode of
tadah refit writes by default: --edit writes refit_edited.hpotarget) or back
into the input with --in-place. For knot-family potentials the commented
RCUT2B/RCUTMB lines are recomputed from the largest knot position (the true
effective cutoff). When the file declares a knot-support cap for a key, the
upper bound of every rewritten OPTIM line of that key is at most the cap
RADIUS; a line whose lower bound would reach the cap is refused.
"""
examples     = ["refit.hpotarget"]
cli_long_flag  = "--retarget"
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.func]
command_only = true
INHERIT = ["TYPES.STRING"]
value_format = ["{phi|rho|F}"]
description  = "Curve selector for `tadah refit --edit`, required there and refused without --edit: phi (pair, CGRID2B), rho (density: a DM_Embed component's DENSITY functions, or a DM_REAM potential's CGRIDMB/AMPGRIDMB) or F (embedding: the component's EMBEDDING functions, or CEMBFUNC)."
