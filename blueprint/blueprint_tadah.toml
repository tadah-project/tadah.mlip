energy of each configuration is reduced by sum_Z N_Z * ESHIFT[Z], so an
isolated-atom config with energy E_atom and ESHIFT[Z]=E_atom yields a
post-shift energy of zero. Used by `tadah train`, `tadah predict`, `tadah hpo`,
and `tadah data balance`.

A potential has the ESHIFT values its training resolved (given, or derived
by ESHIFT_ATOM or ESHIFT_DBATOM) as a key line: the energy reference of the
model. tadah predict subtracts them from the reference energies of the data
it predicts (--eshift replaces them, --no-eshift subtracts none), and a
retrain from the potential (tadah train -c pot.tadah, a tadah hpo -c seed)
uses them; a retrain derives ESHIFT from its own data when the line is
deleted and the run is given ESHIFT_ATOM or ESHIFT_DBATOM (--eshift-atom,
--eshift-dbatom, or a line of a configuration file that includes the
potential: a toggle line of the potential itself is not read).
