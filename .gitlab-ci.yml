variables:
     GIT_SUBMODULE_STRATEGY: recursive
     GIT_SUBMODULE_UPDATE_FLAGS: --remote
     GIT_SUBMODULE_FORCE_HTTPS: "true"
     GIT_STRATEGY: clone

stages:          # List of stages for jobs and their order of execution
  - build
  - test

before_script:
 #- sudo apt-get update --yes
 #- sudo apt-get install --yes g++
 #- sudo apt-get install --yes liblapack-dev
 #- sudo apt-get install --yes libblas-dev
 #- sudo apt-get install --yes gcovr
 - ls -l
 - git status
 - git pull
 - cd MLIP
 - git pull
 - cd ..
 - g++ --version
 - export PATH=$PATH:~/.local/bin
 - export CPATH=$CPATH:~/.local/include
 - export LIBRARY_PATH=$LIBRARY_PATH:~/.local/lib
 - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/.local/lib:/usr/local/lib
 - export OMP_NUM_THREADS=1


build-job:
  stage: build
  script:
    - mkdir -p build
    - cd build
    - cmake .. -DTADAH_ENABLE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=~/.local -DTADAH_BUILD_TESTS=OFF -DCMAKE_CXX_FLAGS="--coverage -g -O1"
    - make -j 1
    - make install

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e build/
  stage: build
  needs: [build-job]
  script:
    - cd build
    - cmake .. -DTADAH_ENABLE_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=~/.local -DTADAH_BUILD_TESTS=ON  -DCMAKE_CXX_FLAGS="--coverage -g -O1"
    - make -j 1
    - rm -rf _deps
    - find . -name "*.a" -exec rm {} +
    - find . -name "*.o" -exec rm {} +
  artifacts:
    paths:
      - "build"

test-job1:
  stage: test
  dependencies:
    - build-job
  script:
    - ta-dah --version
    - ta-dah --help

test-job2:
  stage: test
  needs: [build-tests]
  script:
    - cd build
    - make test
    - gcovr --exclude='.*/Eigen/.*' --exclude='.*/catch2/.*' --exclude='.*/tests/.*' --exclude='.*/CLI11/.*' --exclude='.*/toml11/.*' -r ..
  coverage: /^TOTAL.*\s+(\d+\%)$/