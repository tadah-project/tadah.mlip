structure in its data file; the page
:ref:`What a Fit Minimises <fit_objective>` of the documentation describes
the sum). It balances datasets
against each other: a dataset of hot or highly compressed structures, whose
errors are larger, can get a lower priority than one of near-equilibrium
structures. Each value is a finite number >= 0, one per dataset; a negative
value is refused, naming the dataset. 0 leaves the dataset out of the fit
