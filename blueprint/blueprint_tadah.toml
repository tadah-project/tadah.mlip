[ALLOWED_KEYS.optimizer]
command_only = true
INHERIT = ["TYPES.STRINGS"]
value_N      = [-2147483647]
description  = "Optimiser block inside a `tadah refit` stage block (EXPLORE/REFINE/FUSE): the algorithm, its library and its stopping criteria."
long_description = """
Optimiser block inside a `tadah refit` stage block (EXPLORE/REFINE/FUSE): the
algorithm, its library and its stopping criteria. A multi-line
`OPTIMIZER ... ENDOPTIMIZER` block nested INSIDE a stage block, written
like the `OPTIMIZER` block of a `tadah hpo` target file but taking only the
keys the stage reads: `ALGO <name>` (required; NONE, or UNIFORM for the
EXPLORE optimiser, switches a search off), `LIB <name>` (required, as in
`tadah hpo`, wherever the block runs an optimiser: the library of its ALGO,
NLOPT, DLIB or CERES, and a missing or different LIB is an error; with ALGO
NONE or UNIFORM, which run none, LIB is an error), and the stopping
criteria its ALGO reads (MAXEVAL, an integer from 1 to 2147483647: the
objective evaluations of the NLopt and dlib algorithms, counted exactly,
and the iterations of Ceres' LM and DOGLEG, for which alone MAXITER is its
alias).

A stopping criterion the block's ALGO does not read is an error naming the
ALGO and the keys it reads, and with ALGO NONE or UNIFORM, which run no
optimiser, every one is; the one exception: under the EXPLORE optimiser
GN_MLSL_LDS an INNER block's MAXEVAL, FTOL_REL and XTOL_REL also set MLSL's
local LN_SBPLX searches, whatever its ALGO. The EXPLORE optimiser
(GN_MLSL_LDS, GN_DIRECT_L, GN_CRS2_LM, GLOBAL) reads MAXEVAL, and takes an
optional nested `INNER ... ENDINNER` for the per-rung local search: the
NLopt searches (LN_SBPLX, LN_NELDERMEAD, LN_BOBYQA, LN_PRAXIS, LD_LBFGS)
read MAXEVAL, FTOL_REL and XTOL_REL, dlib's LBFGS MAXEVAL and FTOL_ABS (the
absolute change of the objective it stops at). REFINE: Ceres' LM and DOGLEG
read MAXEVAL (alias MAXITER), FTOL_REL and GTOL, NLopt's LD_LBFGS MAXEVAL
and FTOL_REL, dlib's LBFGS MAXEVAL and FTOL_ABS. FUSE (LM, DOGLEG) reads
MAXEVAL (alias MAXITER), FTOL_REL and GTOL; its MAXEVAL bounds the whole
stage under REFIT_OBJECTIVE energy and each function's FUSE refine under
REFIT_OBJECTIVE curve. The tolerances FTOL_REL, FTOL_ABS, XTOL_REL and GTOL
are finite numbers >= 0 (0 switches the test off; a negative one is an
error). Any other optimiser key (SEED, THREADS, MAXTIME, XTOL_ABS, ...) is
an error naming the keys the stage reads, as the Refitting page describes.

In REFINE and FUSE, ENABLED false (which skips the stage) together with an
OPTIMIZER block is an error: ALGO NONE in the block skips the stage instead. A
top-level OPTIMIZER block (outside every stage block) is rejected in either
REFIT_MODE, before the EAM file is read: it must be nested in a stage. REFIT_MODE compact only: REFIT_MODE dense refuses the stage blocks.

Written inside a stage block, for example::

    REFINE
      OPTIMIZER
        LIB CERES  ALGO LM  MAXEVAL 1000
      ENDOPTIMIZER
    ENDREFINE

or, with an INNER block in EXPLORE::

    EXPLORE
      OPTIMIZER
        LIB NLOPT  ALGO GN_MLSL_LDS  MAXEVAL 60000
        INNER
          LIB NLOPT  ALGO LN_SBPLX  MAXEVAL 20000
        ENDINNER
      ENDOPTIMIZER
    ENDEXPLORE
"""
examples     = []
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

