cell costs. SQRT divides it by sqrt(N), the rule of independent errors of
the atoms: ESIGMA is then in meV per sqrt(atom), and a larger cell's energy
costs more. At the same ESIGMA, ENORM SQRT gives the energy of a 54-atom
cell 54 times the cost it has under ENORM ATOM, an error scale per atom of
ESIGMA/sqrt(54) (0.14 meV/atom for ESIGMA 1). Forces and stresses are not
affected.

