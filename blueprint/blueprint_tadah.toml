description  = "`tadah refit` INIT stage block (`INIT ... ENDINIT`, no optimisation): manual or anchored knots or blips per channel."
long_description = """
`tadah refit` INIT stage block (`INIT ... ENDINIT`, no optimisation):
manual or anchored knots or blips per channel. Each placement is
`<PHI|RHO|F> <MANUAL <mu> [<eta>] | XMIN | XMAX | YMIN | YMAX | SMAX | CMAX> [PIN]`.
MANUAL places a basis function at the fixed centre mu (r in Angstrom for PHI
and RHO, electron density for F), with the inverse width eta for the blip
families. XMIN and XMAX place it at the lower and the upper edge of the fit
window of the channel; XMAX applies to F only and is skipped with a WARNING
for PHI and RHO. YMIN and YMAX place it at the position of the minimum and
of the maximum of the target curve, SMAX and CMAX at the position of its
largest absolute slope and of its largest absolute curvature.
PIN freezes that position in EXPLORE/REFINE/FUSE (the linear coefficient is
still solved). REFIT_MODE compact only: REFIT_MODE dense refuses the block.

Written as a block, one placement per line, for example::

