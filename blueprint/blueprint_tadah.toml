description = "Values of the coefficients that FIXINDEX names, held fixed in the linear fit."
long_description = """
Must be used with FIXINDEX; a lone FIXWEIGHT (or lone FIXINDEX) is a hard
error, and there is no auto-seeding from WEIGHTS. FIXWEIGHT has one value
for each coefficient FIXINDEX names (a range such as 1-4 names four). The
i-th value in FIXWEIGHT fixes the coefficient named by the i-th index in
FIXINDEX (declaration order defines the pairing). Fixed coefficients are
excluded from the least-squares solve; the remaining coefficients are
fitted against the residual target. Refused with NORM=true by tadah train
and tadah hpo (the values would be interpreted in the normalised feature
space: the conversion to coefficients of the raw descriptors moves them).
M_KRR implementation 2 (MODEL M_KRR <kernel> 2) fixes no coefficient and
refuses FIXWEIGHT and FIXINDEX.

In `tadah hpo`, `OPTIM FIXWEIGHT (<coefficient>) <low> <high>` lets the
nonlinear optimiser search a fixed coefficient: the index in parentheses
names a coefficient (an entry of FIXINDEX), not a position in this list.
When FIXINDEX covers every coefficient of the model, the least-squares fit
has no coefficient to fit; in that case a training DBFILE becomes optional
(the loss must then come from validation metrics, PC_OBSERVABLE, or
PC_LAMMPS, and the element set must be declared via ATOM).
"""
examples = ["0.12 1.0 2.00"]

[ALLOWED_KEYS.FIXINDEX]
value_type   = ["{INDEX_PATTERN}"]
value_format = ["<index>[,<index>...]", "<start>-<stop>", "<start>-<stop>:<step>"]
value_N      = [-2147483647]
description = "Indices of the coefficients that the fit holds at their FIXWEIGHT values."
long_description = """
Must be used with FIXWEIGHT; a lone FIXINDEX (or lone FIXWEIGHT) is a hard
error. The i-th index names the coefficient fixed at the i-th FIXWEIGHT
value (declaration order defines the pairing), so FIXINDEX names as many
coefficients as FIXWEIGHT has values, each coefficient once. Indices are
1-based positions among the coefficients of the model: single indices,
ranges start-stop and intervals start-stop:step, separated by commas or
spaces (FIXINDEX 13 14, FIXINDEX 13,14 and FIXINDEX 13, 14 are the same
list; spaces around '-' and ':' are allowed). Refused, naming the text: a
descending range (14-13), a step of 0, a malformed or empty entry (1,,2),
index 0, an index above the number of coefficients of the model, a
coefficient named twice (13,13,14, with two FIXWEIGHT values, one per
distinct coefficient, or with three) and any other number of indices than
FIXWEIGHT's values (a range counts as the indices it names; a mismatch is
refused before any range is expanded).

Without a training DBFILE, FIXINDEX must cover every coefficient of the
model (there is no data to fit the rest). With one, a FIXINDEX that covers
every coefficient leaves tadah train nothing to fit: the potential it writes
has the FIXWEIGHT values as its WEIGHTS, and it says so in a WARNING. A
potential of tadah refit or tadah refit --edit fixes every coefficient so
(the seed of a tadah hpo coefficient search): for a retrain to fit the
coefficients, its FIXINDEX and FIXWEIGHT lines are deleted from a copy of
it. The fixed coefficients leave the fit; LAMBDA penalises every other
coefficient but the intercepts of the model that are not fixed. M_KRR
implementation 2 (MODEL M_KRR <kernel> 2), whose solve fits every
coefficient at once, fixes none: FIXINDEX and FIXWEIGHT are refused with it
(tadah train, tadah hpo at startup), whatever their values.

With BIAS true and a linear model (BF_Linear, Kern_Linear), indices 1 to N
are the per-species intercepts (N = size(ATOM), in ATOM order) and the
coefficients of the descriptor start at N+1. The intercepts of
BF_Polynomial2 are its products (k,k) (coefficients 1 and DSIZE+1 for two
species), those of a dot-product kernel coefficients 1 to N (its intercept
basis vectors). tadah train and tadah hpo warn when FIXINDEX is used with
BIAS true and two or more species, naming the intercept coefficients of the
model.
"""
examples     = ["1,3,5", "1-4,7,9", "1-10:2"]

