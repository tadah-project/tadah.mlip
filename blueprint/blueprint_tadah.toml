[ALLOWED_KEYS.ESIGMA]
INHERIT = ["TYPES.DOUBLE"]
default_value = ["1"]
description = "Energy error scale of a fit, in meV/atom (> 0)."
long_description = """
A fit minimises the sum, over the observations of its training data, of
priority x (residual / error scale)^2, plus the LAMBDA penalty of its
coefficients; the page :ref:`What a Fit Minimises <fit_objective>` of the
documentation describes it. The energy of a structure of N atoms is one
observation: its residual divided by N (ENORM ATOM, the default) or by
sqrt(N) (ENORM SQRT), with the error scale ESIGMA, in meV/atom (meV per
sqrt(atom) under ENORM SQRT). Its priority is the structure's eweight in the
data file times the WDBFILE value of its dataset. The sum is not averaged:
an observation whose residual equals its error scale adds its priority to
the sum, whatever the number of observations.

Only the ratios of the error scales and LAMBDA shape the fit: every error
scale multiplied by c fits as LAMBDA multiplied by c^2. A smaller ESIGMA
pulls the fit towards the energies, away from the forces and stresses.

A value > 0. With ENERGY false (no energies in the fit) a fit refuses an
ESIGMA other than 1. Every potential tadah train and tadah hpo write has an
ESIGMA line, the default included; a retrain from the potential reads it.
"""
examples = ["1", "0.25"]

