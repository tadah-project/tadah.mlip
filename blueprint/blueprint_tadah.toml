cli_long_flag  = "--func"
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.add]
command_only = true
INHERIT = ["TYPES.DOUBLE"]
value_format = ["<centre>"]
description  = "`tadah refit --edit`: inserts a basis function at this centre (r in Angstrom for phi/rho, electron density for F) with coefficient 0 — the potential is unchanged until `tadah hpo` varies the inserted coefficient (exact unless NUMERIC < 17 applies)."
long_description = """
Inserts one basis function into the curve selected by --func, centred at the
given position. The inserted coefficient (a basis-function coefficient for
phi/F, a density amplitude for rho) is 0, so the edited potential predicts
EXACTLY like the input — the inserted basis function only adds capacity for
a subsequent `tadah hpo` run (its OPTIM line is written to the regenerated
target file). Exact unless a NUMERIC below 17 is set for the run (a NUMERIC
line of the input potential is not read): the edited file's numbers are then
written with that many significant digits, with a WARNING (the cutoffs and
grids, RCUT2B/RCUTMB and CGRID*/SGRID*, exactly); without NUMERIC the edit is
exact.

Knot families (Knot5/Knot3): the knot position is the only shape parameter
(--eta is refused: a knot has no width). --deg 3|5 selects the knot
degree (default 5). Adding a radial knot beyond the current largest knot
EXTENDS the effective cutoff — RCUT2B/RCUTMB are updated accordingly.

Blip families (Blip/Blip5): the inverse width defaults to the mean of the
two nearest neighbours' widths (--eta overrides). A blip whose support lies
entirely beyond RCUT is rejected; one whose support crosses RCUT is truncated
there (warning) — RCUT is never changed for blip potentials.
"""
examples     = ["2.75"]
cli_long_flag  = "--add"
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.remove]
command_only = true
INHERIT = ["TYPES.DOUBLE"]
value_format = ["<centre>"]
description  = "`tadah refit --edit`: removes the basis function nearest this centre; the two neighbouring coefficients are least-squares adjusted to track the original curve (value + 1st + 2nd derivative)."
long_description = """
Removes the basis function of the --func curve whose centre is nearest to the
given position (the chosen centre is reported). Unless the removed
coefficient is exactly 0, the two remaining basis functions nearest in centre
are least-squares adjusted against the original curve's value, first and
second derivative, sampled densely over the region the removed function
controlled. Removal is inherently lossy — the report prints the residual
before/after compensation; model performance changes, and the potential needs re-validating.

Removing the OUTERMOST radial knot of a knot-family potential shrinks the
effective cutoff (RCUT2B/RCUTMB follow the largest remaining knot); the tail
between the new and old cutoff cannot be compensated (warning).
"""
examples     = ["2.75"]
cli_long_flag  = "--remove"
cli_short_flag = ""
cli_required   = false

