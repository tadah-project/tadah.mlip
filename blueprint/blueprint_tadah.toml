[ALLOWED_KEYS.refit_objective]
command_only = true
INHERIT = ["TYPES.STRING"]
default_value = ["energy"]
description  = "`tadah refit` compact mode: the objective of the whole fitting chain, 'energy' (default; the crystal energy metric) or 'curve' (a normalised RMSE of the fitted functions and their first two derivatives against the tables). REFIT_MODE dense refuses 'curve' and accepts 'energy'."
long_description = """
`tadah refit` compact mode: the objective of the whole fitting chain, 'energy'
(default; the crystal energy metric) or 'curve' (a normalised RMSE of the
fitted functions and their first two derivatives against the tables).
REFIT_MODE dense refuses 'curve' and accepts 'energy'.

The objective drives the seed, EXPLORE, REFINE and FUSE, and the rung
selection, stall and stop decisions.

'curve' is a normalised combined RMSE of the fitted value and its first and
second derivatives against the tabulated function: each term is divided by
the table's own RMS over the fit window, and the three are RMS-combined. The
target derivatives are the exact analytic derivatives of the setfl cubic
spline (no finite differences). In curve mode the coefficients come from a
stacked value + d1 + d2 least-squares solve, the EXPLORE optimiser searches
the knot positions on that objective, and FUSE refines each function against
its curve, without the energy term or any crystal energy-volume coupling.
The energy metric is not used at all.

Curve mode runs the configured optimiser of every stage (EXPLORE INNER,
REFINE and FUSE). ENABLED false or ALGO NONE skips REFINE or FUSE, and ALGO
NONE in INNER skips the local search. The parser checks each stage's ALGO
against the algorithms that stage accepts, and the log names the optimisers
run. The pressure-relaxed weighting (REFIT_CURVE_WEIGHTING, on by default)
concentrates the fit on the range of r and rho that the crystal samples near
ambient pressure, so an aggressive least-squares optimiser does not over-fit
the high-magnitude regions the crystal does not sample. The ladder grows
until it stalls or reaches REFIT_COMPACT_NMAX: the curve score has no
tolerance threshold.
"""
examples     = ["energy", "curve"]
cli_long_flag  = ""
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.refit_curve_deriv_weight]
