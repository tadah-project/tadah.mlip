cli_short_flag = ""
cli_required     = false

[ALLOWED_KEYS.eshift_atom]
INHERIT = ["TYPES.BOOL"]
description = "Derives ESHIFT from isolated-atom configurations in the dataset (mean per Z)."
long_description = """
Scans the loaded dataset for single-atom configurations (natoms == 1) with
an energy (eweight not 0: one with eweight 0 has no energy of its own),
groups them by atomic number, and sets ESHIFT[Z] to the mean per-Z energy.
If a species has no such isolated-atom configuration in the dataset,
ESHIFT[Z] = 0 for that species and a WARNING is logged. If several
isolated-atom configurations of the same Z disagree by more than 1e-3 eV, an
INFO line records the spread.
Given together with ESHIFT, it is overruled by ESHIFT; it overrules
ESHIFT_DBATOM. A WARNING is logged when more than one of the three is set.

A setting of the training data, not of the model. A potential has the
ESHIFT values the toggle derived as its ESHIFT line, and its training
record, a comment block above its key lines that is never read as keys,
lists the ESHIFT_ATOM its run was given. tadah predict
ignores an ESHIFT_ATOM key line in a potential and derives no shift from
the data it predicts.

When a retrain or a tadah hpo run reads a potential (a file with WEIGHTS,
given with -c or included with CONFIG), the ESHIFT_ATOM line of the
potential is not read, with or without its ESHIFT line. A WARNING names the
line when its value is true. No WARNING is logged when the run gives
ESHIFT_ATOM itself or sets ESHIFT_DBATOM true: the run's own toggle then
takes the place of the potential's.
The run's own ESHIFT_ATOM (--eshift-atom, or a line of a configuration file
that includes the potential) is read, and is overruled by an ESHIFT line as
in any configuration: a retrain derives ESHIFT from its data when the
potential's ESHIFT line is deleted and the run is given ESHIFT_ATOM.
"""
default_value = ["false"]
examples     = ["true"]
cli_long_flag = "--eshift-atom"
cli_short_flag = ""
cli_required   = false

[ALLOWED_KEYS.eshift_dbatom]
INHERIT = ["TYPES.BOOL"]
description = "Derives ESHIFT by least-squares atomic-energy fit over the database."
long_description = """
Fits per-element reference energies by least squares: minimise
||y - M beta||^2 where y[i] is the total energy of configuration i and
M[i, k] is the count of species k in configuration i, over the
configurations with an energy (eweight not 0). The fitted beta_k
becomes ESHIFT[Z(k)]. Preferred over ESHIFT_ATOM when the dataset has no
isolated-atom configurations but has several compositions. A species
that only configurations with eweight 0 contain has no energy to fit: its
ESHIFT is 0, a WARNING names it, and the other species are fitted. When
the compositions do not determine the fit (every structure of one
composition, say) the normal matrix is singular: every ESHIFT is then 0
and a WARNING says so.
Given together with ESHIFT or ESHIFT_ATOM, it is overruled by them (ESHIFT
first), and a WARNING is logged.

A setting of the training data, not of the model. A potential has the
ESHIFT values the toggle derived as its ESHIFT line, and its training
record, a comment block above its key lines that is never read as keys,
lists the ESHIFT_DBATOM its run was given. tadah predict
ignores an ESHIFT_DBATOM key line in a potential and derives no shift from
the data it predicts.

When a retrain or a tadah hpo run reads a potential (a file with WEIGHTS,
given with -c or included with CONFIG), the ESHIFT_DBATOM line of the
potential is not read, with or without its ESHIFT line. A WARNING names the
line when its value is true. No WARNING is logged when the run gives
ESHIFT_DBATOM itself or sets ESHIFT_ATOM true: the run's own toggle then
takes the place of the potential's.
The run's own ESHIFT_DBATOM (--eshift-dbatom, or a line of a configuration
file that includes the potential) is read, and is overruled by an ESHIFT
line as in any configuration: a retrain derives ESHIFT from its data when
the potential's ESHIFT line is deleted and the run is given ESHIFT_DBATOM.
"""
default_value = ["false"]
examples     = ["true"]
cli_long_flag = "--eshift-dbatom"
cli_short_flag = ""
cli_required   = false

