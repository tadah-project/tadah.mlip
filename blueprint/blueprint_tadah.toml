[ALLOWED_KEYS.SETFL]
INHERIT = ["TYPES.STRING"]
description = """Path to the setfl (LAMMPS eam/alloy) file read by D2_EAM (pair function) and DM_EAM (density and embedding)."""
long_description = """
A single-element setfl file (LAMMPS eam/alloy, or eam/fs, which has the same
layout for one element) holds the three EAM functions: D2_EAM reads the pair
function phi(r) and DM_EAM the density rho(r) and the embedding function
F(rho), so one SETFL serves the usual D2_EAM + DM_EAM pair. Each descriptor
takes one parameter on its TYPE line, a placeholder written 0
(TYPE2B D2_EAM 0 Ta Ta, TYPEMB DM_EAM 0 Ta Ta); another value has no effect
and is reported once on standard error (by pair_style tadah as a LAMMPS
warning on rank 0). RCUT2B and RCUTMB must be the
file's cutoff (in a D2_mJoin or DM_mJoin, the EAM descriptor's own value):
the file defines its functions up to it. Another value is refused, naming
both, and so is, at the start of tadah hpo, an OPTIM RCUT2B/RCUTMB over
that value. A potential records the cutoff exactly, whatever NUMERIC is.

The file is read as LAMMPS pair_style eam/alloy reads it: lines 1-3 are
comments; from line 4 on, '#' starts a comment and a line without words is
skipped; then the element line '1 <symbol>', the grid line
'nrho drho nr dr rcut' (which may span lines), the element record
'Z mass a lattice', whose a and lattice are on the line of the mass (LAMMPS
reads the record to the end of that line and the F(rho) table from the next,
so a record split after the mass is refused, naming its line), and the
F(rho), rho(r) and r*phi(r) tables (nrho, nr and nr values), each starting on
a new line. A malformed file is refused, naming the file, the line and the
field: nrho or nr not a whole number of at least 3 (the spline fitted through
a table reads its third point), drho, dr or rcut not a positive finite
number, a header line with a word too many or too few, a table value that is
not a finite decimal number, a short table, or a table whose last line holds
values of the next (LAMMPS drops them). Lines after the last table are not
read. The r tables hold r = 0, dr, ..., (nr - 1) dr, and LAMMPS and tadah
take a table's last value at every r past its last point, so the grid line
must put the cutoff at most one step past it: nr x dr at least rcut (to 1e-4
of rcut, for the rounding of the decimals), and rcut / dr at most 2147483647
(the spline index of a distance is an int); another grid is refused, naming
the numbers.

A configuration with both descriptors and one setfl file::

    INIT2B    true
    TYPE2B    D2_EAM 0 Ta Ta
    RCTYPE2B  Cut_Dummy
    RCUT2B    5.58190742024
    INITMB    true
    TYPEMB    DM_EAM 0 Ta Ta
    RCTYPEMB  Cut_Dummy
    RCUTMB    5.58190742024
    SETFL     Ta.eam.alloy
"""
examples = ['Ta1_Ravelo_2013.eam.alloy']


