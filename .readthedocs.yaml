# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"
  jobs:
    pre_install:
      - echo $READTHEDOCS
      - echo "READTHEDOCS_VERSION (slug)=$READTHEDOCS_VERSION"
      - echo "READTHEDOCS_VERSION_NAME (verbose version name)=$READTHEDOCS_VERSION_NAME"
      # The ref the modules are fetched at (tadah_get_git_branch, cmake-tools)
      # and the docs clone CORE/HPO at (source_locator.py); 'latest' and
      # 'stable' are version names, not refs.
      - echo "READTHEDOCS_GIT_IDENTIFIER (checked-out ref)=$READTHEDOCS_GIT_IDENTIFIER"
      - git status
      - wget https://cmake.org/files/v3.22/cmake-3.22.0-linux-x86_64.sh
      - chmod +x cmake-3.22.0-linux-x86_64.sh
      - mkdir CMAKE
      - ./cmake-3.22.0-linux-x86_64.sh --skip-license --prefix=CMAKE
    post_install:
      - mkdir -p build && cd build && ../CMAKE/bin/cmake .. -DTADAH_BUILD_DOCS_ONLY=ON  && make docs
      - ls -l

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Optionally declare the Python requirements required to build your docs
python:
   install:
   - requirements: docs/requirements.txt

# Server-side search: hpo.html is only a redirect (docs/source/_extra), so it
# is not indexed.  Setting 'ignore' replaces Read the Docs' default list, so
# the defaults are repeated.
search:
   ignore:
   - hpo.html
   - search.html
   - search/index.html
   - 404.html
   - 404/index.html
