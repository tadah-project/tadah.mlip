# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"
  jobs:
    pre_install:
      - wget https://cmake.org/files/v3.22/cmake-3.22.0-linux-x86_64.sh
      - chmod +x cmake-3.22.0-linux-x86_64.sh
      - mkdir CMAKE
      - ./cmake-3.22.0-linux-x86_64.sh --skip-license --prefix=CMAKE
    post_install:
      - mkdir -p build && cd build && ../CMAKE/bin/cmake .. && make docs
      - ls -l
      - cd build/_deps/tadah.models-src && git status
      - cd build/_deps/tadah.mlip-src && git status
      

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Optionally declare the Python requirements required to build your docs
python:
   install:
   - requirements: docs/requirements.txt

